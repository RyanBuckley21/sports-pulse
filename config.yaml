# sports-pulse config
# Declares which stat categories to track per sport and how to compute them.

output_dir: output
top_n: 10

# Sports the site actually builds and shows, in toggle order. Only these are
# fetched and written to data.json, and only if they are also registered in
# generate_stats.SPORT_FETCHERS -- listing a sport here that is not registered
# builds nothing. (The archived worldcup block below is exactly that case.)
# See docs/leagues.md.
#
# THIS KEY GATES THE LEADERBOARDS ONLY -- generate_stats.py's SPORT_FETCHERS
# pipeline ("Who's Hot": players ranked by raw production). The scored per-game
# picks (Signal Scores, weights, thresholds, graded outcomes, the ledger) are
# gated separately by `active_game_sports` below.
#
# epl added 2026-08-21. LEADERBOARDS ONLY, and that is not a promise this key
# makes on its own -- it is a fact about EPL specifically. There is now a
# calibrated `betting_signals.epl` block further down, but a config block is
# not an activation: EPL has no entry in generate_insights.GAME_BUILDERS, and
# _active_game_sports filters its resolved list down to sports registered
# there, so EPL still cannot reach the scored-picks pipeline through this
# key's fallback. What switches it on is registering a builder AND naming it
# in `active_game_sports` -- two deliberate steps, neither of which this key
# performs. Adding a sport that IS registered (nfl, cfb) would be a different
# matter and needs `active_game_sports` set explicitly first.
active_sports: [mlb, epl]

# Sports whose SCORED PER-GAME PICKS are built -- generate_insights.py's
# GAME_BUILDERS pipeline. Deliberately a different key from `active_sports`
# above: the two were one list until they were split, which meant adding a
# sport to publish its leaderboards silently switched on its betting markets
# too. They are now independently gate-able in both directions -- leaderboards
# without picks, picks without leaderboards, or both.
#
# NOW SET EXPLICITLY, and epl is on it. It was commented out while the fallback
# to `active_sports` happened to give the right answer; it no longer does, since
# epl is registered in GAME_BUILDERS and the fallback would switch it on as a
# side effect of publishing its leaderboards -- precisely the accident the split
# exists to prevent. Naming both sports here makes the decision explicit and
# leaves nfl and cfb off, registered but inactive.
#
# An explicitly EMPTY list (`active_game_sports: []`) is honoured as a real
# kill switch -- no scored picks for any sport -- rather than falling back.
#
# CFB added 2026-08-27, GAMES AND TEAMS ONLY -- there is no cfb entry in
# generate_stats.SPORT_FETCHERS and no `cfb.stat_categories`, so it publishes no
# player leaderboards at all. That is not a restriction this key imposes; CFB
# simply never had a leaderboard fetcher, which suits a sport whose player props
# are not the point.
#
# ITS CFBD COST IS ZERO UNLESS A RUN CAN COMMIT THE CACHE. See fetchers/cfb.py's
# CFBD_ALLOW_ENV: only daily-stats-and-grade.yml sets CFB_ALLOW_CFBD, because
# only it commits data/boxscores.json. Week 0/1 costs nothing regardless (no
# prior form exists to fetch), and the ESPN fallback schedule costs nothing ever
# (its game ids cannot join CFBD rows, so the fetch would buy an empty join).
#
# WHAT EPL DOES AND DOES NOT GET FROM THIS. It gets scored markets, a Team
# Pulse, and a per-sport partition in data/insights.games.json with the same
# pre-game freeze rules MLB's has. It does NOT get graded: signal_report.py
# runs with --sport defaulting to mlb and reads only that partition, so EPL
# picks are published and stored but never scored against their outcome and
# never reach data/signal_report_history.jsonl. That gap is the module's own
# documented one ("a real gap for whenever a second sport's grading actually
# ships"), not something this change introduces -- but it does make it live, so
# EPL has no accuracy ledger until a grader learns the sport. The backtest is
# the only accuracy evidence EPL has.
active_game_sports: [mlb, epl, cfb]

# Kill switch for the AI Insights layer (generate_insights.py's `claude -p`
# prose + the JS AI Note blurb). false = no AI calls, no AI text in the UI --
# everything else (betting_signals, training_capture, boxscore cache, outcome
# resolution, deterministic pulse/signals/comparisons) keeps running. Flip
# back to true to re-enable; nothing about this flag deletes committed state.
ai_insights:
  enabled: false

mlb:
  base_url: https://statsapi.mlb.com/api/v1
  season: 2026
  window_games: 10        # rolling window size for counting stats
  candidate_pool_size: 40 # season leaders pulled per seed category before re-ranking on the rolling window
  recent_seed_days: 24    # date window (~20 games) for the recent-form pool seed
  recent_pool_size: 40    # top-N recent leaders unioned into the season pool

  stat_categories:
    - key: home_runs
      label: Home Runs (last 10 G)
      short_label: Home Runs
      unit: HR
      group: hitting
      mode: rolling_sum
      fields: [homeRuns]
      seed_leaderboards: [homeRuns]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: total_bases
      label: Total Bases per Game (last 10 G, true avg)
      short_label: Total Bases/G
      unit: TB/G
      group: hitting
      mode: rolling_sum
      fields: [totalBases]
      per_game: true
      seed_leaderboards: [totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: hits_runs_rbi
      label: Hits + Runs + RBI per Game (last 10 G, true avg)
      short_label: H+R+RBI/G
      unit: H+R+RBI/G
      group: hitting
      mode: rolling_sum
      fields: [hits, runs, rbi]
      per_game: true
      seed_leaderboards: [hits, runs, runsBattedIn]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: strikeouts
      label: "Strikeouts per Game (last 10 G, today's starters only, true avg)"
      short_label: K/G (Starters)
      unit: K/G
      group: pitching
      mode: rolling_sum
      fields: [strikeOuts]
      per_game: true
      starters_only: true
      window_games: 10

    - key: hit_streak
      label: Active Hit Streak
      short_label: Hit Streak
      unit: GAMES
      group: hitting
      mode: hit_streak
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    # threshold_rate: how often a player clears a per-game bar within a
    # recent window. `fields` are summed per game, compared to `threshold`;
    # `min_games` is a small-sample qualification floor (fewer games in the
    # window than this and the player is dropped from ranking entirely).
    - key: hit_rate
      label: Hit Rate (games with 1+ hit, last 20 G)
      short_label: Hit Rate
      unit: "1+H"
      group: hitting
      mode: threshold_rate
      fields: [hits]
      threshold: 1
      window_games: 20
      min_games: 16
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: run_producer_rate
      label: Run Producer Rate (games with 2+ H/R/RBI, last 20 G)
      short_label: Run Producer
      unit: "2+HRR"
      group: hitting
      mode: threshold_rate
      fields: [hits, runs, rbi]
      threshold: 2
      window_games: 20
      min_games: 16
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    # window_starts_only: the window counts a pitcher's actual starts (games
    # with gamesStarted >= 1), not calendar games, so relief cameos don't
    # dilute a starter's last-10-starts rate.
    - key: k_rate
      label: K Rate (starts with 6+ K, last 10 starts)
      short_label: K Rate
      unit: "6+K"
      group: pitching
      mode: threshold_rate
      fields: [strikeOuts]
      threshold: 6
      window_games: 10
      min_games: 6
      starters_only: true
      window_starts_only: true

# NFL "Who's Hot" leaderboard categories (fetchers/nfl.py's fetch(), via
# generate_stats.SPORT_FETCHERS). Structurally parallel to the mlb block above.
#
# THIS IS A DIFFERENT NAMESPACE FROM `betting_signals.nfl` further down, and
# the two must not be conflated. This block describes leaderboards: which raw
# stats to rank players by, over what window. That block describes a scored
# betting market: weights, scales, conviction thresholds. Nothing here is a
# weight and nothing here is graded against an outcome.
#
# Not fetched or shown while `nfl` is absent from active_sports (same gate the
# worldcup block below sits behind).
nfl:
  season: 2025
  # Most recent games a player ACTUALLY PLAYED, not calendar weeks -- so a bye
  # week or an inactive week shifts the window back rather than punching a hole
  # in it. 4 is about a quarter of a 17-game season; MLB's last-10-of-162 is
  # about 6%. There is no NFL window that reproduces that proportion (6% of 17
  # is one game), so an NFL board is inherently less "recent-form" and more
  # "recent-season" than an MLB one. That is a property of the sport, not a
  # tuning choice to be corrected later.
  window_games: 4

  stat_categories:
    # ---- per-game rate boards (per_game: true) ----------------------------
    # min_games: 2 -- enough to kill a one-game fluke topping a board, low
    # enough that boards appear from week 2 and that a player returning from a
    # bye still qualifies. Measured on real 2024 data (weeks 6-9), requiring a
    # full 4-of-4 window would have discarded ~40% of otherwise-qualified
    # receivers, most of them simply on bye.
    - key: passing_yards
      label: Passing Yards per Game (last 4 G)
      short_label: Pass Yds/G
      unit: YDS/G
      mode: rolling_sum
      fields: [passing_yards]
      per_game: true
      min_games: 2

    # positions: RB -- measured across all 15 four-week windows of 2024, a
    # mobile QB cracked the rushing top 10 in 3 of them (Lamar Jackson twice,
    # Jayden Daniels once), always at rank 9-10. Correct numbers, but "top
    # rushers" listing a QB reads as a bug to a football audience, so the board
    # is filtered to the position it claims to rank.
    - key: rushing_yards
      label: Rushing Yards per Game (last 4 G, RB only)
      short_label: Rush Yds/G
      unit: YDS/G
      mode: rolling_sum
      fields: [rushing_yards]
      per_game: true
      min_games: 2
      positions: [RB]

    # WR/TE for the two receiving boards: pass-catching RBs otherwise land on
    # a board that reads as a wideout ranking. Same reasoning as rushing above.
    - key: receiving_yards
      label: Receiving Yards per Game (last 4 G, WR/TE only)
      short_label: Rec Yds/G
      unit: YDS/G
      mode: rolling_sum
      fields: [receiving_yards]
      per_game: true
      min_games: 2
      positions: [WR, TE]

    - key: receptions
      label: Receptions per Game (last 4 G, WR/TE only)
      short_label: Rec/G
      unit: REC/G
      mode: rolling_sum
      fields: [receptions]
      per_game: true
      min_games: 2
      positions: [WR, TE]

    # ---- counting boards (touchdowns) ------------------------------------
    # tiebreak_fields: a TD board over four games is a small integer, so ties
    # pile up (a dozen players at 2 TDs is a normal week). Without a tiebreak
    # those resolve in arbitrary dict order; the underlying yardage settles
    # them on real production, reusing rank_records' existing `tiebreak` key.
    #
    # RESOLVED (2026-08): NO min_games FLOOR ON THESE FOUR BOARDS. The removal
    # was taken back to review together with the prior decision it overturned,
    # and it was SUSTAINED. This is settled rather than provisional -- treat it
    # as the current rule, not as an open question.
    #
    # What settled it was one measurement rather than an argument: replaying
    # the real 2025 nflverse file across weeks 5-18, over all four TD boards, a
    # player with fewer than two games took 0 of 560 top-10 slots. The abuse
    # the floor had been ratified to prevent does not occur in real data, while
    # its cost did (week 1 published nothing at all).
    #
    # EVERYTHING BELOW IS THE HISTORY OF HOW THAT WAS DECIDED, kept on purpose.
    # The floor was argued for and accepted before it was removed, so anyone
    # thinking of re-adding it should read why it was there first -- and should
    # expect to beat the 0-of-560 result to make the case.

    # min_games: DELIBERATELY ABSENT HERE, AND THIS REVERSES AN EARLIER
    # RATIFIED DECISION. Recording both sides, because the earlier one was
    # argued and accepted rather than overlooked.
    #
    # The earlier position: min_games: 2 was raised in review as an addition
    # beyond the originally-locked decision (which named a floor only for the
    # per-game rate boards) and was ratified on the grounds that "a counting
    # board with no floor lets a single-game player top it -- one 3-TD game
    # beats everyone else's four-game total of 2 -- which is the exact failure
    # the rate boards' floor exists to prevent."
    #
    # Why it is reversed: that reasoning imports a rate board's failure mode
    # into a board that does not have it. A floor exists to stop a small
    # DENOMINATOR manufacturing a rank, and a counting board has no
    # denominator. One 3-TD game outranking a four-game total of 2 is not a
    # distortion -- the player did score more touchdowns in the window the
    # board covers -- whereas 3 TDs in one game shown as 3.0 TD/G genuinely is.
    # The predicted failure also does not occur. Measured on the real 2025
    # nflverse file, replaying every week 5-18 across all four TD boards: of
    # 560 top-10 slots, a player with fewer than two games took ZERO of them.
    # Reaching a TD top-10 mid-season takes 3-4 scores in the window, and a
    # player back from injury for one game essentially never posts that -- the
    # scenario the floor was ratified to prevent is one the data does not
    # produce. What the floor did produce was measurable loss: every TD board
    # sat blank for the whole of week 1 (0 rows vs 147 with the floor removed),
    # and it kept dropping legitimately-returning players thereafter.
    #
    # The board still states its own depth rather than hiding it:
    # CATEGORY_META's "Last {n} G" resolves per build from games_window, so a
    # week-1 board reads "Last 1 G" and never claims a four-game trend. Ties
    # among low counts are settled by tiebreak_fields below, which sum real
    # yardage over the same window -- so a one-game player at 1 TD ranks below
    # a four-game player at 1 TD with more yardage behind it.
    #
    # Same rule, same argument, as the EPL block's stat_categories header.
    #
    # These four boards are deliberately NOT position-filtered: the locked
    # decision named only the three yardage/reception boards. The visible
    # consequence is that rushing QBs and receiving RBs DO appear here.
    - key: passing_tds
      label: Passing TDs (last 4 G)
      short_label: Pass TD
      unit: TD
      mode: rolling_sum
      fields: [passing_tds]
      tiebreak_fields: [passing_yards]

    - key: rushing_tds
      label: Rushing TDs (last 4 G)
      short_label: Rush TD
      unit: TD
      mode: rolling_sum
      fields: [rushing_tds]
      tiebreak_fields: [rushing_yards]

    - key: receiving_tds
      label: Receiving TDs (last 4 G)
      short_label: Rec TD
      unit: TD
      mode: rolling_sum
      fields: [receiving_tds]
      tiebreak_fields: [receiving_yards]

    - key: total_tds
      label: Total TDs (rushing + receiving, last 4 G)
      short_label: Total TD
      unit: TD
      mode: rolling_sum
      fields: [rushing_tds, receiving_tds]
      tiebreak_fields: [rushing_yards, receiving_yards]

# Premier League "Who's Hot" leaderboard categories (fetchers/epl.py's
# fetch(), via generate_stats.SPORT_FETCHERS). Structurally parallel to the
# mlb and nfl blocks above.
#
# LEADERBOARD ONLY. There is deliberately NO `betting_signals.epl` block
# anywhere in this file, and no EPL entry in generate_insights.GAME_BUILDERS.
# Nothing here is a weight, a conviction threshold, or graded against an
# outcome. Its absence is the clearest available statement of that boundary.
#
# Not fetched or shown while `epl` is absent from active_sports.
# CFB fetcher/grader endpoints. Small next to the `epl` block below because
# almost everything CFB needs is a constant in fetchers/cfb.py -- the schedule
# sources, the season window, the call ceiling. What lives here is the pair
# signal_report's grading adapter reads, plus the block's own existence: a
# sport with no top-level config key is rejected by `--sport`, which is what
# kept `--sport cfb` from running at all.
#
# These MUST equal fetchers/cfb.ESPN_CFB_SCOREBOARD and ESPN_FBS_GROUP. That
# module has its own copy because it needs the same endpoint for the fallback
# schedule; tools/verify/test_cfb_grading.py asserts the two agree so a grader
# reading a different endpoint from the builder cannot ship quietly.
cfb:
  scoreboard_url: "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard"
  fbs_group: 80

epl:
  scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard
  summary_url: https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary

  # A player's most recent 5 APPEARANCES, not matchdays -- rotation, injury
  # and suspension shift the window back rather than leaving gaps.
  #
  # 5, not NFL's 4: goals are low-frequency, and over four matches a striker's
  # total is often 0-3, too coarse to separate a board. 5 of 38 is ~13% of a
  # season, between NFL's 4-of-17 (~24%) and MLB's 10-of-162 (~6%).
  window_games: 5
  # Calendar span searched to find those appearances. Generous on purpose: a
  # rotated or recently-injured player needs a wider span to accumulate five,
  # and matches outside every player's window are simply never selected.
  # Each match in range costs one summary call (~8s per 50 matches measured).
  #
  # This span is NOT required to cover the offseason, and deliberately does not
  # try to. The gap between seasons is wider than any sane in-season window
  # (89 days from 2026-05-24 to 2026-08-21, measured live), so between seasons
  # fetchers/epl.py re-anchors this same span to the last day the league
  # actually played instead of to today, and the boards carry the closing
  # matchdays of the previous season until the new one has matches of its own.
  # See fetch()'s OFFSEASON FALLBACK note. Raising this number to reach across
  # a summer is therefore unnecessary, and would cost a summary call per extra
  # match all season long.
  lookback_days: 75

  stat_categories:
    # MIN_GAMES IS A RATE-BOARD TOOL AND IS SET ONLY ON RATE BOARDS.
    #
    # An appearance floor exists to stop a tiny denominator from manufacturing
    # a rank. That is a real hazard for a RATE: one goal in one appearance is
    # 1.00 goals/app, which tops goals_per_appearance over a striker on 5 in 5
    # (0.80) on the strength of a single cameo. The floor is the only thing
    # standing between that board and noise, so goals_per_appearance keeps
    # min_games: 3.
    #
    # A COUNTING board has no denominator and therefore no such hazard. One
    # goal in one appearance is one goal -- it ranks below two goals and above
    # zero, which is exactly right, and no amount of small sample can inflate
    # it. Applying the floor there bought nothing and cost real data: every
    # counting board sat blank until players reached three appearances, which
    # in a league whose season opens after a 3-month gap meant the boards were
    # empty for the first two matchdays of every season while genuine goals,
    # assists and clean sheets were already on the record. The six counting
    # boards below therefore set no min_games at all and fall through to
    # aggregate_category's default of 1 -- one appearance, i.e. the player
    # actually played. `total <= 0` already drops anyone who did nothing.
    #
    # Depth is still reported rather than hidden: each record carries its own
    # games_window, and CATEGORY_META's "Last {n} App" subtitle resolves to
    # the board's real depth per build, so a matchday-1 board says "Last 1
    # App" instead of promising five.

    # ---- unfiltered boards ------------------------------------------------
    # No position filter: a goal counts the same whoever scores it, so these
    # are the boards where bench-only players (16% of the pool, whose real
    # position ESPN never reports -- see fetchers/epl.stable_position) stay
    # fully eligible.
    - key: goals
      label: Goals (last 5 appearances)
      short_label: Goals
      unit: G
      mode: rolling_sum
      fields: [totalGoals]

    - key: assists
      label: Assists (last 5 appearances)
      short_label: Assists
      unit: A
      mode: rolling_sum
      fields: [goalAssists]

    - key: goal_or_assist
      label: Goal Contributions (last 5 appearances)
      short_label: Goal Contributions
      unit: G+A
      mode: rolling_sum
      fields: [totalGoals, goalAssists]

    # ---- attacking boards, Forward/Midfielder only ------------------------
    # Filtered because these rank attacking output: a defender or keeper on
    # the same board is not a meaningful comparison. Position is resolved as
    # the player's modal non-bench position across the window, so a striker
    # who came off the bench once is still a Forward.
    #
    # per_appearance -- NOT per 90, and the label must never say otherwise.
    # ESPN's payload carries no minutes played, only an appearances flag, so a
    # 10-minute cameo and a full 90 count identically. Naming this "per 90"
    # would claim a normalisation the data cannot support.
    - key: goals_per_appearance
      label: Goals per Appearance (last 5 appearances, Fwd/Mid)
      short_label: Goals/App
      unit: G/APP
      mode: rolling_sum
      fields: [totalGoals]
      per_appearance: true
      min_games: 3
      positions: [Forward, Midfielder]

    - key: shots_on_goal
      label: Shots on Target (last 5 appearances, Fwd/Mid)
      short_label: Shots on Target
      unit: SOT
      mode: rolling_sum
      fields: [shotsOnTarget]
      positions: [Forward, Midfielder]

    # Total shots, sitting alongside shots on target rather than replacing it.
    # The two answer different questions: on-target is end product, total is
    # volume and intent, and a player generating six shots that miss is a
    # genuinely different (and often more interesting) read than one who put
    # two on target. Measured over 597 real player-match rows from the closing
    # weeks of 2025-26, totalShots is non-zero on 286 of them against
    # shotsOnTarget's 142 -- twice the qualifying pool, because it keeps the
    # volume shooters who are not converting.
    #
    # totalShots is a real ESPN field, not a derivation: present on 597 of 597
    # rows in that sample, and shotsOnTarget never exceeded it once (0
    # violations), so the pair is internally coherent and safe to show side by
    # side. Contrast shotsFaced, the adjacent field this repo already refuses
    # to build on -- it was present on all 597 rows and NON-ZERO ON NONE.
    #
    # No min_games, matching every other counting board: a small window cannot
    # inflate a raw shot count, only understate it. Same Fwd/Mid filter as
    # shots on target, for the same reason -- it ranks attacking output, and a
    # defender on that board is not a meaningful comparison.
    - key: shots_total
      label: Total Shots (last 5 appearances, Fwd/Mid)
      short_label: Total Shots
      unit: SH
      mode: rolling_sum
      fields: [totalShots]
      positions: [Forward, Midfielder]

    # ---- goalkeeper boards ------------------------------------------------
    # cleanSheets is not an ESPN field. It is derived per match by
    # fetchers/epl.extract_clean_sheet_credits, which credits a starting
    # keeper only when they conceded nothing AND were never subbed off AND no
    # goalkeeper substitution occurred for their team -- because goalsConceded
    # alone is ambiguous when a backup comes on. The adjacent shotsFaced field
    # is outright wrong (a keeper conceding 2 with 1 save reported 0), which is
    # why no board is built on it.
    - key: clean_sheets
      label: Clean Sheets (last 5 appearances, GK)
      short_label: Clean Sheets
      unit: CS
      mode: rolling_sum
      fields: [cleanSheets]
      positions: [Goalkeeper]

    - key: saves
      label: Saves (last 5 appearances, GK)
      short_label: Saves
      unit: SV
      mode: rolling_sum
      fields: [saves]
      positions: [Goalkeeper]

# ARCHIVED -- the 2026 tournament is over and the next cycle is ~2030. This
# block is KEPT (nothing here is deleted) but the sport is no longer REGISTERED
# in generate_stats.py: its SPORT_FETCHERS, SPORT_LABELS, APPROVED_CATEGORIES
# and CATEGORY_META entries were removed so its category keys (goals, assists,
# shots, ...) stop occupying those flat, sport-agnostic namespaces and a real
# soccer league can claim them.
#
# Consequence worth knowing: adding `worldcup` back to active_sports is NO
# LONGER ENOUGH on its own -- with no SPORT_FETCHERS entry, main() logs
# "no fetcher registered" and builds nothing. See docs/leagues.md's
# "Reviving it for 2030" for the full checklist.
worldcup:
  competition: FIFA World Cup 2026
  scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard
  summary_url: https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary

  stat_categories:
    - key: shots
      label: Total Shots per Game (tournament, true avg)
      short_label: Total Shots/Game
      unit: SH/G
      mode: tournament_total
      fields: [totalShots]
      per_game: true

    - key: shots_on_goal
      label: Shots on Goal per Game (tournament, true avg)
      short_label: Shots on Goal/G
      unit: SOG/G
      mode: tournament_total
      fields: [shotsOnTarget]
      per_game: true

    - key: goals
      label: Goals (tournament)
      short_label: Goals
      unit: G
      mode: tournament_total
      fields: [totalGoals]

    - key: goal_or_assist
      label: Goal Involvements (tournament)
      short_label: Goal Involvements
      unit: G+A
      mode: tournament_total
      fields: [totalGoals, goalAssists]

    - key: assists
      label: Assists (tournament)
      short_label: Assists
      unit: A
      mode: tournament_total
      fields: [goalAssists]

    - key: clean_sheets
      label: Clean Sheets (tournament, starting GK, full match only)
      short_label: Clean Sheets
      unit: CS
      mode: tournament_total
      fields: [cleanSheets]

# Betting Signal Layer -- deterministic per-game Signal Scores per bet type,
# computed by betting_signals.py from the Game builder's existing inputs (14d
# OPS, 7d bullpen ERA, probable-starter ERA, season series) plus availability.
# Sport-keyed: mlb populated, other sports reserved empty. All values are v1,
# tunable (see the design proposal). `favors` direction per metric is intrinsic
# and lives in code, not here; this block holds weights, scales, and thresholds.
# Player matchup_note gate: the player's CAREER line vs the pitcher they face
# next gets a one-sentence AI note ONLY when it clears this bar (enough sample AND
# lopsided enough to matter). Provisional v1 -- tuned against a real-data hit-rate
# check. vs-pitcher history is inherently sparse, so notes fire selectively.
player_angle:
  mlb:
    # Two INDEPENDENT gates; the angle fires if EITHER clears.
    # avg path -- needs a real sample to trust a rate:
    min_ab_avg: 5      # at-bats floor for the avg paths
    hot_avg: 0.350     # "owns this pitcher"
    cold_avg: 0.150    # "has been overmatched"
    # hr path -- 2+ career HR is signal even in a small sample, so its own lower floor:
    min_ab_hr: 3       # at-bats floor for the HR path
    min_hr: 2

betting_signals:
  mlb:
    # Score below which a bet type reports "No clear lean" instead of a side.
    min_threshold: 15
    # Run Line needs a stronger lean (the favorite must cover 1.5 runs).
    run_line_threshold: 35
    # A game's single most-notable market must clear THIS (much stricter than the
    # per-market lean thresholds above) before the AI writes a one-sentence
    # betting_note about it. Below it, no betting prose is written at all.
    #
    # Recalibrated twice on real simulation, never guessed. 50 -> 20 when the
    # bet_types weights below became reliability-proportional (concentrating weight
    # on fewer, more reliable signals raises every score, so 50 was measuring a
    # different scale). Then 20 -> 15 when season_series was dropped, which removes
    # the largest single weight from the two side markets and lowers their scores
    # again.
    #
    # 15 is the CLOSEST REACHABLE value, not a free choice. Production before this
    # change carried 928 of 1,388 real 2026 games (66.9%). Without season_series
    # the slate plateaus at 850 (61.2%) and no lower standout_threshold recovers
    # the rest: min_threshold (15) already drops any market below it from
    # list_markets, so top_market cannot return one, and 15 is where the two
    # thresholds meet. The remaining 78-game shortfall is structural -- games where
    # no market carries a lean at all rose from 304 to 538, because _finalize needs
    # >=2 signals agreeing with the net direction and the side markets just went
    # from four signals to three. Recovering those would mean moving min_threshold
    # or that guard, which is a separate decision and not made here.
    #
    # Then 15 -> 17 when first_five_total was retired and nrfi_yrfi was reduced to
    # its single surviving signal. That was NOT expected to move the slate much --
    # first_five_total won only 16 of 850 slots -- but simulated it moved a lot:
    # nrfi_yrfi's lean is now the undiluted combined_starter_era signal, so its
    # scores rose and it took 104 -> 322 slots, pushing the slate to 960 (69.2%)
    # at the old 15. 17 brings it back to 861 of 1,388 (62.0%) against production's
    # 850 (61.2%), eleven games apart. Worth recording that "this market rarely
    # wins a slot" did not imply "removing it barely moves the threshold".
    #
    # At 17 the standout bar is once again above min_threshold (15), so the
    # stricter-than-lean distinction the two thresholds express is restored --
    # it had collapsed when they were briefly equal.
    standout_threshold: 17
    # tanh normalization: `*_gap` = the home-vs-away spread that reads as a
    # meaningful edge; `*_total`/`*_solo` = league baseline + spread for
    # over/under-style magnitudes.
    scales:
      ops_gap: 0.080
      bullpen_gap: 1.50
      era_gap: 1.20
      ops_total: { base: 1.45, scale: 0.15 }
      starter_total: { base: 8.0, scale: 2.5 }
      bullpen_total: { base: 8.0, scale: 3.0 }
      ops_solo: { base: 0.725, scale: 0.080 }
      era_solo: { base: 4.0, scale: 1.20 }
      bullpen_solo: { base: 4.0, scale: 1.50 }
    # Per bet type: which base signals feed it and their weights. Bullpen is
    # excluded from the first-five markets (relievers rarely pitch in the first
    # five innings); NRFI/YRFI and totals lean toward more runs on the (+) side.
    #
    # RELIABILITY-PROPORTIONAL. Each weight below is a domain base split scaled by
    # the MEASURED reliability of the signal family it names, then renormalized:
    #     starter ERA 0.252 · team OPS 0.189 · bullpen ERA 0.071
    # Those come from this repo's own data (predictive validity against real runs,
    # corrected for the ceiling any team-level predictor can reach).
    #
    # season_series was the fourth family and has been REMOVED, not shrunk. It was
    # measured the same way the other three were, against real 2026 games, and it
    # carries no usable signal:
    #   * point-biserial r with the real home/away result = -0.02, 95% CI
    #     [-0.083, +0.042] -- not significant, and the point estimate is the WRONG
    #     SIGN. Bootstrap P(r > 0) = 0.26.
    #   * adding it to a model already holding the other three does nothing:
    #     likelihood-ratio test p = 0.291, AUC +0.0016, pseudo-R2 +0.0008.
    #   * it does not exist in 29% of games (the teams have not met yet), so the
    #     market silently re-weighted around it for a third of the season.
    #   * where it does exist the median sample is 2 games, 65% sit at the maximum
    #     +/-1.0, and 42% of those are ONE game -- it was the only base signal used
    #     raw, with no tanh scale and no shrinkage.
    # Shrinking it was not a coherent alternative: the natural centre of a
    # head-to-head differential is 0, so shrinking toward that with a median
    # sample of 2 games is removal by a longer route.
    #
    # first_five_total was RETIRED as a scored market, not reweighted. Its
    # Over/Under lean is a weighted blend of combined_starter_era and
    # combined_ops; implied_total.first_five_estimate() computes the `point` it is
    # graded against from away_ops/home_ops/away_sp/home_sp -- the same four raw
    # numbers. Measured, the lean correlates +0.78 with its own point estimate, so
    # a stronger lean RAISES the bar it has to clear. Against the real Over/Under
    # outcome over 1,199 games it scored r=-0.0199, 95% CI [-0.077, +0.037], with
    # its dominant starter component at r=-0.0276. That is not a weak market to be
    # retuned; the circularity is in the target definition, so no reweighting can
    # fix it. The estimate itself is still computed and shown as information.
    #
    # Removed weight is NOT redistributed. _raw_lean renormalizes by the weight
    # sum, so only relative weights matter; redistributing would actively promote
    # whatever family received it rather than leave the rest in place. A key simply
    # absent from a market's dict is never looked up -- no scoring-code change is
    # needed to drop a family.
    bet_types:
      moneyline:
        team_ops: 0.378
        bullpen_era: 0.118
        probable_era: 0.504
      # No longer a copy of moneyline. A run line needs a DECISIVE margin, which
      # tracks the starting-pitching mismatch more than a narrow team-quality
      # edge, so the base split leans starter (ops 0.25 / pen 0.20 / starter 0.40)
      # before the same reliability scaling is applied.
      run_line:
        team_ops: 0.291
        bullpen_era: 0.088
        probable_era: 0.621
      game_total:
        combined_ops: 0.377
        combined_starter_era: 0.502
        combined_bullpen_era: 0.121
      first_five_moneyline:
        probable_era: 0.677
        team_ops: 0.323
      # First-inning runs are the starter facing the top of the order once, so the
      # bullpen never appears and a full-game team OPS is a weak proxy for one
      # inning. Measured against the real YRFI outcome over 1,388 games,
      # combined_ops contributed nothing -- r=+0.0169 with a 95% CI spanning zero
      # -- while combined_starter_era ALONE (r=+0.0605, CI [+0.008, +0.113])
      # measured BETTER than the 0.80/0.20 blend it was part of (r=+0.0588). The
      # OPS term was diluting, not helping, so it is dropped rather than shrunk:
      # nothing reliable was there to preserve. A single-signal market is fine --
      # _finalize's >=2-agreeing guard is bypassed when n_avail < 2.
      nrfi_yrfi:
        combined_starter_era: 1.0
      team_total:
        team_ops: 0.502
        opp_bullpen_era: 0.126
        opp_starter_era: 0.372
  # NFL -- moneyline only, v1 (see nfl_signals.py; run against fetchers/nfl.py's
  # nflverse-derived team form). NOT in active_sports yet -- built, wired, and
  # NOW BACKTEST-CALIBRATED, but still not live; going live in active_sports
  # is a separate decision made after these numbers have been reviewed, same
  # staged-rollout precedent worldcup already sets below.
  #
  # CALIBRATED against real 2021-2025 seasons (nfl_backtest.py), the same
  # "measure, don't guess" discipline mlb's own weights/scales/threshold
  # history above documents -- but this is a SINGLE BACKTEST PASS, not months
  # of live production measurement the way mlb's numbers are. Treat every
  # value below as a first-pass starting point subject to revision once real
  # production data accumulates, exactly like mlb's standout_threshold walked
  # 50 -> 20 -> 15 -> 17 as its signal set changed under it -- this is where
  # that walk STARTS for NFL, not where it ends.
  #
  # Measured against 1,424 real games (1,359 regular season + 65 postseason,
  # 2021-2025): point-biserial r of each signal's direction-corrected raw
  # gap against the real home-win outcome, with a 2000-sample bootstrap 95%
  # CI. Two signals are NOT in bet_types.moneyline below, for two DIFFERENT
  # reasons kept distinct on purpose:
  #   * rest_diff -- DROPPED. r=+0.0417, 95% CI [-0.0100, +0.0924] spans
  #     zero: not distinguishable from no signal at all. Same treatment
  #     mlb's season_series got once measured (r=-0.02, also dropped, not
  #     shrunk).
  #   * scoring_margin -- EXCLUDED, not dropped. Its own correlation clears
  #     zero cleanly (r=+0.2245, CI [+0.1723, +0.2776]) -- the reason it's
  #     out is NOT that it doesn't predict anything, it measurably does.
  #     It is heavily collinear with the signals that survive: r=+0.71 with
  #     off_epa, +0.60 with def_epa_allowed, +0.50 with turnover_diff
  #     (pairwise correlation among the signals THEMSELVES, not vs.
  #     outcome) -- expected, since a team's scoring margin is largely a
  #     restatement of what its EPA numbers already capture, aggregated
  #     differently. Reliability-proportional weighting assumes each
  #     signal is INDEPENDENT evidence; scoring_margin measurably is not,
  #     so including it would double-count the same underlying "team
  #     quality" information under two different names. No equivalent
  #     multivariate check (partial correlation / logistic regression
  #     controlling for the other signals) was run to confirm this more
  #     rigorously -- this was a judgment call from the pairwise-correlation
  #     table, not a statistical drop, and is flagged as the single biggest
  #     open methodological question in this calibration.
  #
  # Survivors' weights are r^2 (variance explained), renormalized to sum to
  # 1 -- NOT ceiling-corrected the way mlb's weights are (mlb's account for
  # "the ceiling any team-level predictor can reach", established against
  # this repo's own multi-month MLB production data; an equivalent NFL
  # ceiling has not been established, so this is plain reliability-
  # proportional weighting, not ceiling-corrected reliability):
  #     off_epa r=+0.2473 -> 0.8380 · turnover_diff r=+0.0851 -> 0.0992 ·
  #     def_epa_allowed r=+0.0677 -> 0.0628
  # off_epa's weight looks stark relative to the other two because r^2
  # weighting is sensitive to relative gaps, not because the other two were
  # judged unimportant -- both cleared their own CI independently.
  #
  # scales are the measured sample stdev of each signal's own raw home-away
  # gap (replacing the earlier ballpark placeholders). All five are still
  # populated, including scoring_margin's and rest_diff's -- nfl_signals.
  # _base_signals computes a directional value for every SIGNAL_SPECS entry
  # unconditionally and divides by its scale, whether or not that entry is
  # ever looked up by a bet_type's weights.
  #
  # min_threshold/standout_threshold recomputed from the resulting score
  # distribution under the NEW (3-signal) weights -- the distribution shifts
  # whenever the weights do, so the OLD threshold from a different weight
  # set would not mean the same thing here. 50 is the largest threshold in
  # the tested sensitivity table (0/5/.../70) that still keeps >=33% of the
  # 1,424 games gradeable (552, 38.8%), and it also happened to be a local
  # peak in win rate (67.8%) rather than a step down from a nearby option --
  # not a coincidence this backtest engineered for, just what the table
  # showed. Set equal (v1 has exactly one market, so there is no second,
  # noisier market for standout_threshold to be stricter than the way mlb's
  # run_line/nrfi_yrfi give its two thresholds room to differ).
  #
  # FINAL GRADED RESULT under these weights/thresholds, outcome-graded (real
  # final scores, not an estimate): 374-178 (67.8%) on 552 decided picks,
  # combined. Regular season alone: 363-173 (67.7%) on 536 decided picks.
  # POSTSEASON: 11-5 (68.8%) on just 16 decided picks -- reported because
  # postseason play can differ meaningfully from the regular season, NOT
  # because 16 picks is enough to independently validate or refute that;
  # read it as "here is what the same model does on playoff games," not as
  # its own settled finding. Naive always-pick-home baseline over the same
  # 2021-2025 window: 54.6% (776/1420 decided games) -- the calibrated model
  # clears that baseline at every threshold tested, combined and regular-
  # season alike.
  nfl:
    min_threshold: 50
    standout_threshold: 50
    scales:
      off_epa_gap: 0.1566
      def_epa_gap: 0.1356
      turnover_gap: 1.1357
      margin_gap: 10.1113
      rest_gap: 2.3662
    bet_types:
      moneyline:
        off_epa: 0.8380
        turnover_diff: 0.0992
        def_epa_allowed: 0.0628
  # ------------------------------------------------------------------------ #
  # CFB (FBS) -- EVERY NUMBER BELOW IS A FLAT, PRE-CALIBRATION PLACEHOLDER.
  #
  # Nothing here has been backtested against anything. This block is the exact
  # counterpart of the nfl block as it shipped in PR #34, before PR #35
  # measured reliability and replaced it: equal weights across the available
  # signals, round-number scales, and a near-zero threshold. Read every value
  # as "not yet measured", not as a tuned number. The calibration pass is its
  # own follow-up PR, same sequencing NFL had.
  #
  # Weights are EQUAL (1/3 each) on purpose. Hand-picking a starting split
  # would bake in a guess that the backtest then has to argue its way out of;
  # a flat prior is the honest starting point and makes the calibration
  # delta interpretable.
  cfb:
    # BACKTEST-DERIVED, replacing the flat placeholders this block shipped
    # with. Measured by cfb_backtest.py over 2023-2025, FBS-vs-FBS only,
    # 2,398 games (2,264 regular season + 134 postseason). Same procedure
    # NFL's calibration used: point-biserial r of each signal's
    # direction-corrected raw gap against the real home-win outcome, 95%
    # bootstrap CI, reliability-proportional (r^2) weights renormalized over
    # survivors, thresholds read off a sensitivity table.
    #
    # Measured performance at these values: 76.9% combined / 77.4% regular
    # season, outcome-graded against real final scores, versus a 58.6% naive
    # always-pick-home baseline over the same games. Per-season spread was
    # 77.5 / 76.1 / 77.2, which is the main reason to believe this is not
    # fitted noise.
    #
    # THIS IS A MONEYLINE HIT RATE, NOT A PROFITABILITY CLAIM. No odds, line
    # or price data enters this repo anywhere. CFB moneyline picks concentrate
    # on heavy favourites, so a high hit rate says nothing about whether these
    # picks beat the vig -- do not read 76.9% as an edge over the market.
    #
    # FIRST PASS, SUBJECT TO REVISION AFTER REAL PRODUCTION DATA -- same
    # framing as NFL's calibrated block. One backtest is not the same
    # evidence as months of graded live picks; MLB's constants took several
    # rounds of real production measurement to settle, and these have had
    # none. Known gaps, all flagged rather than assumed away: no ceiling
    # correction (weights are raw r^2), pairwise rather than multivariate
    # collinearity testing, and no shrinkage (a week-2 team's one-game form
    # is weighted like a week-12 team's).
    #
    # 40, up from the deliberately near-zero placeholder of 1. Picked as the
    # most selective candidate still leaving at least a third of games
    # gradeable: coverage falls monotonically as the threshold rises (t>=0
    # 68.3% on 1,788 picks; t>=40 76.9% on 901; t>=70 85.4% on 280), so this
    # trades volume for precision at the point the curve is still cheap. A
    # judgment call, not a measurement.
    min_threshold: 40
    standout_threshold: 40
    # MEASURED dispersion -- the stdev of each signal's own raw home-away gap
    # across all 2,398 games, replacing the round-number guesses. turnover_gap
    # moved most (0.50 -> 1.3292, 2.7x): college turnover margins swing far
    # wider than the placeholder assumed, so the old scale was saturating the
    # tanh on ordinary games.
    scales:
      off_ppa_gap: 0.1686
      def_ppa_gap: 0.1568
      turnover_gap: 1.3292
      # Cold start only. Stdev of the prior-season margin gap over the 733
      # week-1/2 games across 2016-2025 that have a prior season on both sides
      # (2020 excluded, COVID). Schedule-derived, so measuring it cost no CFBD
      # calls. The all-weeks figure is 16.04 over 5,825 games -- close enough
      # that the early-season subset is not a special population.
      prior_margin_gap: 15.6676
      # Fallback tier 1. Stdev of THIS season's point-in-time margin gap over
      # the 5,233 games across 2015-2025 where both sides had the three-game
      # minimum. Also schedule-derived, also free.
      season_margin_gap: 17.0004
    bet_types:
      # Moneyline only in v1. Weights are reliability-proportional over the
      # three signals that survived measurement: r = 0.3351 / 0.2612 / 0.1891
      # respectively, all with 95% CIs clearing zero comfortably, so nothing
      # was auto-dropped (unlike NFL, which lost rest_diff that way).
      #
      # scoring_margin is STILL ABSENT, but for a reason now measured for CFB
      # rather than inherited from NFL. It has the HIGHEST individual r of any
      # candidate (0.4155) and on reliability alone would take the largest
      # weight -- but it is collinear with all three others (r = +0.70 off_ppa,
      # +0.69 def_ppa_allowed, +0.54 turnover_diff), where those three are only
      # mildly correlated with each other (0.18-0.34). A points differential is
      # definitionally a summary of what the other three measure, and
      # reliability-proportional weighting assumes independent evidence.
      # Grading both variants settles it: including it changes the outcome by
      # ONE pick in 901 (693 HIT / 208 MISS either way). It stays computed and
      # unweighted in each game's `context` (fetchers/cfb.build_scoring_margins)
      # so a future backtest can re-test it cheaply.
      moneyline:
        off_ppa: 0.5193
        def_ppa_allowed: 0.3154
        turnover_diff: 0.1654
        # FALLBACK TIERS, never co-present with the three above OR with each
        # other -- cfb_signals.score_game picks the first tier that has
        # anything and blanks the rest, so each of these is always the only
        # signal in its lean and is always renormalized to 1.0. Their
        # magnitudes carry no meaning at all; both are 1.0 precisely so nobody
        # reads either as "a fifth of a lean". See _FALLBACK_TIERS.
        #
        # Before these, a game with no CFBD form scored 0 -- every week-0 and
        # week-1 game, and every game of a season on the ESPN fallback
        # schedule. Walk-forward over ten seasons: season_margin 76.0% at
        # threshold 40, prior_margin 73.7% in week 1, against the calibrated
        # PPA model's 76.9% on the same measure.
        #
        # Same caveat as the block above, and it matters more here: these are
        # STRAIGHT-UP HIT RATES on games where the favourite is obvious and the
        # market knows it. Not a claim of edge.
        season_margin: 1.0
        prior_margin: 1.0
  # ------------------------------------------------------------------------ #
  # EPL (Premier League) -- BACKTEST-DERIVED. Measured by epl_backtest.py over
  # 2019/20-2025/26, every completed match, 2,660 total; 2,307 clear the
  # five-prior-matches gate and are scoreable.
  #
  # Same method NFL's and CFB's calibrations used -- each signal's
  # direction-corrected raw gap correlated against the real outcome, 95%
  # bootstrap CI, reliability-proportional (r^2) weights renormalized over the
  # survivors, threshold read off a sensitivity table -- with three departures
  # forced by the sport. All three are in epl_backtest.py's report, not buried:
  #
  #   1. DRAWS ARE AN OUTCOME, NOT AN EXCLUSION. This is the departure the other
  #      two follow from. A draw is a normal result in this sport -- 23.6% of
  #      these 2,660 matches -- unlike NFL's 0.2% ties, which nfl_backtest can
  #      afford to throw away. So draws are kept in three separate places, and
  #      it takes all three:
  #        THE MARKET is double_chance ("<team> or Draw"), so a draw COUNTS FOR
  #        the pick. A 1X2 market would make a draw the thing that beats you and
  #        would hand the model an outcome it can never name -- which is exactly
  #        what "throwing draws out" means in practice, whatever the reliability
  #        pass does.
  #        THE RELIABILITY PASS correlates against GOAL DIFFERENCE rather than a
  #        point-biserial on home_win with draws dropped, so every match counts.
  #        The home_win version is reported alongside and agrees closely (attack
  #        +0.366 vs +0.357, defense +0.329 vs +0.339), which is what says this
  #        is a better estimator rather than a different question.
  #        THE OUTPUT names it -- see outcome_split below.
  #
  #      WHAT IS NOT CLAIMED: the model does not PICK draws, and that limit was
  #      measured, not assumed. A draw is never the modal outcome in any lean
  #      band; the draw rate is flat at 17-27% with no usable pattern;
  #      correlation with the lean is -0.013 (95% CI [-0.051, +0.027]) and with
  #      the match's scoring environment -0.016 (CI [-0.057, +0.023]), both
  #      spanning zero. That second one was tested specifically because a draw
  #      might plausibly depend on a SUM -- how low-scoring both sides are --
  #      rather than the difference signal_core.paired computes; it does not. In
  #      every lean band, picking the leaning side beats picking the draw by 6 to
  #      33 points. Including draws in the market is honest; forecasting them
  #      would be invention.
  #
  #   2. THE HEADLINE NUMBER IS OUT OF SAMPLE. NFL and CFB derive weights over
  #      all seasons and grade on those same seasons. Seven seasons is enough to
  #      do better, so epl_backtest walks forward: weights for season S are fit
  #      on seasons < S only. The weights BELOW are then fit on all seven, as
  #      NFL's and CFB's are -- the walk-forward number is the evidence that
  #      such a fit generalises, not a separate model.
  #
  #   3. FOUR CANDIDATES WERE REJECTED, for two different reasons that are kept
  #      apart because collapsing them would misrepresent both:
  #        rest       DROPPED -- 95% CI [-0.084, +0.030] spans zero on goal
  #                   difference AND [-0.049, +0.041] on home_win. A statistical
  #                   result, the same treatment NFL's rest_diff got.
  #        goal_diff  EXCLUDED -- r=+0.403, the STRONGEST single signal measured,
  #        form_ppm   and out anyway: r=0.90 with attack and 0.83 with defense
  #        recent_gd  makes it close to their linear combination, and
  #                   reliability-proportional weighting assumes independent
  #                   evidence. Same for form_ppm (0.84 with attack, 0.84 with
  #                   venue_form) and recent_gd (0.89 with recent_form). These
  #                   are out DESPITE predicting well; reading "excluded" as
  #                   "doesn't predict" inverts the reason.
  #
  # HOW MUCH THE SET CHOICE MATTERS: almost nothing, and that was measured
  # rather than assumed. Across four candidate sets, on every match both sets
  # score above the bar, they pick the SAME SIDE -- 100% agreement, 714 of 714
  # for the two leading sets. The sets differ in WHICH matches clear the
  # threshold, not in direction, and the accuracy differences are inside a
  # +/-4-5pp bootstrap CI (attack+defense alone grades 60.2%; the four-signal
  # set below, 60.7%). The set below is chosen for STRUCTURE, not for that
  # 0.5pp: attack and defense are the two genuinely separable dimensions
  # (r=0.50 with each other, the lowest pair among the strong signals) and
  # mirror mlb's ops/bullpen and nfl's off/def EPA split; recent_form adds
  # form-vs-season-long; venue_form is the only signal carrying venue
  # information at all.
  #
  # MEASURED PERFORMANCE at these values, out of sample, threshold 55:
  # 85.2% on double_chance over 738 picks, against a 67.1% always-pick-
  # home-or-draw baseline on the same gated slate. Per-season: 79.2 / 84.1 /
  # 87.5 / 88.6 / 84.5 / 87.6 -- a 9.4-point spread, and the weak season is
  # 2020/21, played in empty stadiums, where home advantage inverted league-wide
  # (home wins 37.9% against away 40.3%, the only season of the seven where away
  # is ahead). A model leaning partly on venue form having its worst year there
  # is the expected failure, not an unexplained one.
  #
  # THE OUTRIGHT MARKET at its own bar of 75: 344 picks, 17.8% of the scoreable
  # slate, 68.3% -> break-even 1.46, with the draw tax on those matches down to
  # 18.0% against the league's 23.3%. Per season 65 / 71 / 66 / 75 / 64 / 62.
  # On those same 344 matches double chance grades 86.3% -> break-even 1.16,
  # which is the comparison that matters: an 86.3% hit rate priced at 1.16 is
  # not obviously better than a 68.3% one priced at 1.46, and only the price on
  # offer settles it. That is why both markets ship and why every market carries
  # its break-even.
  #
  # Read across the whole slate the same lean grades 61.7% on 1X2 against a
  # 43.8% always-home baseline -- kept in the report as the figure comparable to
  # the other sports' moneyline rates, since cfb's 76.9% and nfl's are
  # two-outcome markets and reading them against 85.2% would flatter this one.
  #
  # THIS IS A HIT RATE, NOT A PROFITABILITY CLAIM -- the same warning cfb's
  # block carries, and it binds harder here. No odds, line or price data enters
  # this repo anywhere. Draws are priced by the market; a 1X2 hit rate cannot
  # see that, so nothing here says these picks beat the vig.
  #
  # NO HOME-ADVANTAGE INTERCEPT. signal_core.paired() is a pure home-minus-away
  # difference, so two equally-formed sides produce a lean of exactly zero while
  # the home side in fact wins 43.4% of matches and the away side 32.9%. A
  # constant term cannot be fitted into that shape -- no variance to correlate,
  # no stdev to scale by. venue_form carries venue information instead and
  # measurably does part of the job (it moves the share of home picks from 50.0%
  # to 55.5%). The residual was measured, not waved away: sweeping a decision
  # offset over the lean recovers at most +0.3pp, because the picks a home bias
  # would flip sit near zero lean and are close to coin flips.
  #
  # FIRST PASS, SUBJECT TO REVISION AFTER REAL PRODUCTION DATA -- same framing
  # as nfl's and cfb's calibrated blocks. One backtest is not months of graded
  # live picks; mlb's constants took several rounds of real production
  # measurement to settle and these have had none.
  epl:
    # 55 is the most selective threshold that still keeps at least a third of
    # the scoreable slate (36.5% at 55; 30.9% at 60) -- nfl_backtest's rule,
    # flagged there as a judgment call and flagged as one here. Accuracy rises
    # monotonically with it (74.7% at 0, 79.9% at 35, 85.2% at 55, 86.5% at 75),
    # so this is a coverage/accuracy trade rather than an optimum.
    min_threshold: 55
    standout_threshold: 55
    # Each scale is the measured standard deviation of that signal's own raw
    # gap over the 2,307 scoreable matches, so a one-sigma edge maps to the same
    # place on the tanh for every signal. Every SIGNAL_SPECS entry needs one --
    # _base_signals divides by it unconditionally -- including the four that
    # carry no weight.
    scales:
      attack_gap: 0.7257
      defense_gap: 0.5752
      recent_form_gap: 0.9717
      venue_form_gap: 0.8646
      form_ppm_gap: 0.7443
      goal_diff_gap: 1.1297
      recent_gd_gap: 1.4378
      rest_gap: 4.8390
    bet_types:
      # IDENTICAL WEIGHTS ON PURPOSE. There is one model here and two ways to
      # take it, not two models: both markets read the same lean, and the
      # weights are fitted to goal difference, which is market-neutral (refitting
      # to a does-not-lose target moves them by at most 0.0156). What separates
      # the markets is the bar each must clear -- see market_thresholds.
      #
      # r=+0.366 / +0.329 / +0.294 / +0.330; r^2 renormalized over the four.
      #
      # A draw WINS this one: both sides are "<team> or Draw".
      double_chance:
        attack: 0.3057
        defense: 0.2475
        venue_form: 0.2488
        recent_form: 0.1979
      # A draw LOSES this one: the side outright, 3-way moneyline.
      match_result:
        attack: 0.3057
        defense: 0.2475
        venue_form: 0.2488
        recent_form: 0.1979
    # WHERE THE DRAW GETS PRICED INTO AN OUTRIGHT PICK, rather than only
    # reported. A draw wins double_chance and loses match_result, so the two
    # markets cannot share a bar.
    #
    # double_chance 55 -- the standard one-third-coverage rule (see above).
    #
    # match_result 75 -- a DIFFERENT rule, because coverage is not what the
    # outright market is trading off. It is admitted only where the draw tax it
    # pays is measurably below the league's own draw rate, and 75 is the lowest
    # threshold where that is true: P(draw) 18.2%, 95% CI [14.4%, 22.6%], whose
    # upper bound clears the 23.3% base rate. At 70 the CI still overlaps it
    # ([16.8%, 24.3%]) and the market has no measured edge to justify taking the
    # worse side of a draw.
    #
    # The underlying effect is real and was checked rather than assumed: draw
    # rate falls from 25.4% in the 50-69 band to 13.9% at 85+, a difference of
    # -11.5pp with 95% CI [-18.1, -4.5]. NOTE this does not contradict the
    # near-zero LINEAR correlation between the lean and a draw (r=-0.013)
    # recorded above -- the relationship is flat through the middle and drops
    # only in the tail, so both facts hold. The linear figure is why a draw band
    # near zero lean fails; the tail effect is why an outright market at a high
    # bar works.
    market_thresholds:
      double_chance: 55
      match_result: 75
    # Observed frequencies of the three results, banded by Signal Score, over
    # all 2,307 scoreable matches. NOT a fitted distribution -- real counts, on
    # the same deterministic footing as everything else here.
    #
    # This is what makes the draw VISIBLE rather than merely survivable, and it
    # is also what prices both markets: epl_signals derives each market's
    # win_prob and FAIR ODDS from this table, so a reader can compare the
    # break-even against the price actually on offer instead of trusting a hit
    # rate in isolation. Double chance at 55 breaks even at 1.21 and is
    # routinely priced near there, which is exactly why the outright market
    # exists alongside it.
    #
    # `side` is the leaning side winning outright and `other` is the opposite
    # side winning, so double_chance wins on side+draw and match_result on side
    # alone -- reported apart rather than pre-added so the card can show all
    # three and each market can price itself.
    #
    # Extend by adding a row; epl_signals.outcome_split takes the highest band
    # a score clears and needs no code change for a new one.
    # BANDS ARE ALIGNED TO THE TWO DECISION POINTS (55 and 75), not to round
    # numbers. They were 0/25/50/70 while double_chance was the only market,
    # which lumped a score of 76 and a score of 99 into one band and reported
    # the same break-even for both -- useless precisely where the outright
    # market lives. The 85 band is split out because that is where the draw tax
    # collapses (13.2% against the 23.6% league rate).
    outcome_split:
      - {min_score: 0,  side: 0.433, draw: 0.210, other: 0.357}
      - {min_score: 25, side: 0.464, draw: 0.263, other: 0.273}
      - {min_score: 55, side: 0.563, draw: 0.266, other: 0.171}
      - {min_score: 75, side: 0.622, draw: 0.219, other: 0.159}
      - {min_score: 85, side: 0.778, draw: 0.132, other: 0.090}
  # Reserved for future sports; empty = no betting layer.
  worldcup: {}

# Team Pulse -- a deterministic 0-100 notability score for ONE team, built from
# that team's own form against league average. Sport-keyed like the blocks above;
# mlb populated, other sports reserved empty (no block = no team pulse, and the
# Teams view simply renders nothing for that sport).
#
# `base` and `scale` are deliberately the SAME league-average constants the
# betting_signals scales already carry -- ops_solo for offense, bullpen_solo for
# the pen -- because they answer the same question ("where is league average, and
# how far from it is a meaningful move"). They are duplicated here rather than
# cross-referenced so this block stays readable on its own and so retuning the
# betting layer can't silently move the Teams view; if league average genuinely
# shifts, both should be updated together.
#
# `weight` splits the two components. They are renormalized over whichever
# components actually have data, so a team with no games in one window is scored
# on the other alone rather than being penalized for the gap or given a made-up
# value. A team with neither gets no pulse at all.
team_pulse:
  mlb:
    # Higher OPS is better. Matches betting_signals.mlb.scales.ops_solo.
    ops:
      base: 0.725
      scale: 0.080
      weight: 0.50
      window_days: 14
    # LOWER bullpen ERA is better -- the sign flip lives in code, same rule as
    # betting_signals' `favors` direction. Matches scales.bullpen_solo.
    bullpen:
      base: 4.00
      scale: 1.50
      weight: 0.50
      window_days: 7
  # EPL. MEASURED, not picked: `base` is the league mean and `scale` one
  # standard deviation of the club-season spread, over all 140 club-seasons in
  # 2019/20-2025/26 (7 x 20). So a club one sigma better than average lands at
  # tanh(1) of the way toward the top of the band, which is the same reading
  # mlb's ops/bullpen block gives.
  #
  #   goals scored / match    mean 1.432  stdev 0.446  (range 0.53 - 2.68)
  #   goals conceded / match  mean 1.432  stdev 0.359  (range 0.68 - 2.74)
  #
  # The two means are necessarily identical -- every goal scored is a goal
  # conceded -- but the SPREADS are not, and that asymmetry is real: attacks
  # differ from each other more than defences do. Weighting 50/50 despite that
  # is deliberate, because each is already normalized by its own scale.
  #
  # DIRECTION IS IN CODE, NOT HERE -- more scored is good, FEWER conceded is
  # good. Same split betting_signals and mlb._team_pulse use.
  #
  # min_matches is the same cold-start floor epl_signals.MIN_MATCHES applies to
  # scoring, and it matters more for a Pulse than for a lean: a club that has
  # played once and won 4-0 would otherwise read as the best attack in the
  # division on a 90-minute sample. Below it the club gets NO pulse and the card
  # renders without one, rather than a 50 that would look measured.
  epl:
    min_matches: 5
    attack:
      base: 1.432
      scale: 0.446
      weight: 0.50
    defense:
      base: 1.432
      scale: 0.359
      weight: 0.50
  # CFB. MEASURED from real results, not picked: `base` is the FBS mean and
  # `scale` one standard deviation of the team-season spread, over all 136 FBS
  # programs across the 2025 season, FBS-vs-FBS games only.
  #
  #   points scored / game   mean 25.92  stdev 6.43  (range 9.7 - 44.6)
  #   points allowed / game  mean 26.41  stdev 6.08  (range 10.0 - 39.6)
  #
  # FBS-vs-FBS ONLY is doing real work in those numbers. FBS programs schedule
  # FCS opponents on purpose and win them by design, so including those games
  # would inflate exactly the programs that scheduled the weakest opponents --
  # a systematic bias, not noise. The same restriction fbs_matchup_index
  # enforces for the scored model.
  #
  # COSTS NO CFBD CALLS. Unlike the scored model, whose signals are all CFBD
  # (off_ppa, def_ppa_allowed, turnover_diff), these come from the schedule
  # this fetcher already holds. That is the point: the Teams tab renders on
  # every run, including the ones where team form is skipped entirely -- week
  # 1, the ESPN fallback schedule, or the per-run call ceiling.
  #
  # min_games 3 bites harder here than the equivalent floor in any other sport.
  # A CFB season is twelve games, so three is a quarter of it and there is no
  # 162-game average to absorb one blowout. Below it a program gets NO pulse
  # rather than a 50, which would read as measured.
  cfb:
    min_games: 3
    offense:
      base: 25.92
      scale: 6.43
      weight: 0.50
    defense:
      base: 26.41
      scale: 6.08
      weight: 0.50
  # Reserved for future sports; empty = the Teams view renders nothing.
  worldcup: {}

# ---------------------------------------------------------------------------
# Insights UI presentation, sport-keyed (mirrors betting_signals / player_angle).
# The Python build resolves these into data.json so the JS components stay
# sport-blind -- MLB fills its set now; NFL/NBA/CFB/PL get their own later
# WITHOUT touching component code. An empty/missing sport block simply means the
# config-driven affordances (category strip, comparison table) don't render for
# that sport; the generic pieces (pulse, signals, AI note) still do.
insights_ui:
  mlb:
    # Static category strip (icon names resolve to inline SVGs in the component's
    # registry -- config carries names/labels, never markup).
    signal_categories:
      - { key: starting_pitching, label: "Starting Pitching", icon: mound }
      - { key: bullpen,           label: "Bullpen Fatigue",    icon: relief }
      - { key: offense,           label: "Offense Form",       icon: bat }
    # Readable market names for the Signal Score list / Best Angle (replaces the
    # old hardcoded _BET_MARKET_LABELS in generate_insights.py). Keys match
    # betting_signals bet_types.
    market_labels:
      moneyline: "Moneyline"
      run_line: "Run Line"
      game_total: "Game Total"
      first_five_moneyline: "First Five Moneyline"
      first_five_total: "First Five Total"
      nrfi_yrfi: "First-Inning Runs"
      team_total: "Team Total"
    # Generic "compare N metrics between two entities" tables. `better` is the
    # winning direction; the build resolves which side wins per row. Metrics whose
    # data isn't in the pipeline yet are simply absent (K%/BB%/WHIP this phase).
    compare_sets:
      probable_starters:
        title: "Probable Starters"
        metrics:
          - { key: era, label: "ERA", format: era, better: low }
    # Implied-total label wording (the number/units the UI shows). Sport-specific
    # phrasing lives here, not in the JS.
    est_total:
      label: "Run Estimate"
      unit: "runs"
      note: "Rough model estimate from team form & pitching — not a betting line. No park, weather, or lineup data."
    # First five innings is its own, cruder model (starters only, no bullpen),
    # so it gets its own wording: the note names the assumption that actually
    # limits it rather than repeating the full-game caveats.
    first_five_total:
      label: "First Five Estimate"
      unit: "runs"
      note: "Rough model estimate from the probable starters — not a betting line. Assumes both starters work the first five; no bullpen, park, weather, or lineup data."
  # Reserved for future sports; empty = no config-driven affordances render.
  # EPL. The strip and the market names; no compare_sets, because a soccer match
  # has no two-entity comparison equivalent to MLB's probable starters -- the
  # per-side numbers are already the Key Signals rows.
  epl:
    signal_categories:
      - { key: attack,      label: "Attack Form",   icon: boot }
      - { key: defense,     label: "Defensive Solidity", icon: shield }
      - { key: recent_form, label: "Recent Form",   icon: streak }
    # Keys match betting_signals.epl bet_types. "Match Result" rather than
    # "Moneyline": the market has three outcomes and calling it a moneyline
    # invites the two-outcome reading every other sport in this file uses.
    market_labels:
      double_chance: "Double Chance"
      match_result: "Match Result"

  # CFB. Market label only -- no signal_categories strip and no compare_sets.
  # Both would describe CFBD-derived inputs (PPA, turnover margin), and a strip
  # advertising signals that are absent on every keyless run would be a promise
  # the page cannot keep. The Key Signals rows already name whatever resolved.
  cfb:
    market_labels:
      moneyline: "Moneyline"

  worldcup: {}
