# sports-pulse config
# Declares which stat categories to track per sport and how to compute them.

output_dir: output
top_n: 10

# Sports the site actually builds and shows, in toggle order. Only these are
# fetched and written to data.json. The worldcup block below is kept intact as
# a working reference/template for future soccer leagues (e.g. Premier League)
# but stays off until its key is listed here. See docs/leagues.md.
active_sports: [mlb]

# Kill switch for the AI Insights layer (generate_insights.py's `claude -p`
# prose + the JS AI Note blurb). false = no AI calls, no AI text in the UI --
# everything else (betting_signals, training_capture, boxscore cache, outcome
# resolution, deterministic pulse/signals/comparisons) keeps running. Flip
# back to true to re-enable; nothing about this flag deletes committed state.
ai_insights:
  enabled: false

mlb:
  base_url: https://statsapi.mlb.com/api/v1
  season: 2026
  window_games: 10        # rolling window size for counting stats
  candidate_pool_size: 40 # season leaders pulled per seed category before re-ranking on the rolling window
  recent_seed_days: 24    # date window (~20 games) for the recent-form pool seed
  recent_pool_size: 40    # top-N recent leaders unioned into the season pool

  stat_categories:
    - key: home_runs
      label: Home Runs (last 10 G)
      short_label: Home Runs
      unit: HR
      group: hitting
      mode: rolling_sum
      fields: [homeRuns]
      seed_leaderboards: [homeRuns]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: total_bases
      label: Total Bases per Game (last 10 G, true avg)
      short_label: Total Bases/G
      unit: TB/G
      group: hitting
      mode: rolling_sum
      fields: [totalBases]
      per_game: true
      seed_leaderboards: [totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: hits_runs_rbi
      label: Hits + Runs + RBI per Game (last 10 G, true avg)
      short_label: H+R+RBI/G
      unit: H+R+RBI/G
      group: hitting
      mode: rolling_sum
      fields: [hits, runs, rbi]
      per_game: true
      seed_leaderboards: [hits, runs, runsBattedIn]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: strikeouts
      label: "Strikeouts per Game (last 10 G, today's starters only, true avg)"
      short_label: K/G (Starters)
      unit: K/G
      group: pitching
      mode: rolling_sum
      fields: [strikeOuts]
      per_game: true
      starters_only: true
      window_games: 10

    - key: hit_streak
      label: Active Hit Streak
      short_label: Hit Streak
      unit: GAMES
      group: hitting
      mode: hit_streak
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    # threshold_rate: how often a player clears a per-game bar within a
    # recent window. `fields` are summed per game, compared to `threshold`;
    # `min_games` is a small-sample qualification floor (fewer games in the
    # window than this and the player is dropped from ranking entirely).
    - key: hit_rate
      label: Hit Rate (games with 1+ hit, last 20 G)
      short_label: Hit Rate
      unit: "1+H"
      group: hitting
      mode: threshold_rate
      fields: [hits]
      threshold: 1
      window_games: 20
      min_games: 16
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: run_producer_rate
      label: Run Producer Rate (games with 2+ H/R/RBI, last 20 G)
      short_label: Run Producer
      unit: "2+HRR"
      group: hitting
      mode: threshold_rate
      fields: [hits, runs, rbi]
      threshold: 2
      window_games: 20
      min_games: 16
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    # window_starts_only: the window counts a pitcher's actual starts (games
    # with gamesStarted >= 1), not calendar games, so relief cameos don't
    # dilute a starter's last-10-starts rate.
    - key: k_rate
      label: K Rate (starts with 6+ K, last 10 starts)
      short_label: K Rate
      unit: "6+K"
      group: pitching
      mode: threshold_rate
      fields: [strikeOuts]
      threshold: 6
      window_games: 10
      min_games: 6
      starters_only: true
      window_starts_only: true

# INACTIVE -- preserved as a template for future soccer leagues (see
# active_sports above and docs/leagues.md). Not fetched or shown while its key
# is absent from active_sports.
worldcup:
  competition: FIFA World Cup 2026
  scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard
  summary_url: https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary

  stat_categories:
    - key: shots
      label: Total Shots per Game (tournament, true avg)
      short_label: Total Shots/Game
      unit: SH/G
      mode: tournament_total
      fields: [totalShots]
      per_game: true

    - key: shots_on_goal
      label: Shots on Goal per Game (tournament, true avg)
      short_label: Shots on Goal/G
      unit: SOG/G
      mode: tournament_total
      fields: [shotsOnTarget]
      per_game: true

    - key: goals
      label: Goals (tournament)
      short_label: Goals
      unit: G
      mode: tournament_total
      fields: [totalGoals]

    - key: goal_or_assist
      label: Goal Involvements (tournament)
      short_label: Goal Involvements
      unit: G+A
      mode: tournament_total
      fields: [totalGoals, goalAssists]

    - key: assists
      label: Assists (tournament)
      short_label: Assists
      unit: A
      mode: tournament_total
      fields: [goalAssists]

    - key: clean_sheets
      label: Clean Sheets (tournament, starting GK, full match only)
      short_label: Clean Sheets
      unit: CS
      mode: tournament_total
      fields: [cleanSheets]

# Betting Signal Layer -- deterministic per-game Signal Scores per bet type,
# computed by betting_signals.py from the Game builder's existing inputs (14d
# OPS, 7d bullpen ERA, probable-starter ERA, season series) plus availability.
# Sport-keyed: mlb populated, other sports reserved empty. All values are v1,
# tunable (see the design proposal). `favors` direction per metric is intrinsic
# and lives in code, not here; this block holds weights, scales, and thresholds.
# Player matchup_note gate: the player's CAREER line vs the pitcher they face
# next gets a one-sentence AI note ONLY when it clears this bar (enough sample AND
# lopsided enough to matter). Provisional v1 -- tuned against a real-data hit-rate
# check. vs-pitcher history is inherently sparse, so notes fire selectively.
player_angle:
  mlb:
    # Two INDEPENDENT gates; the angle fires if EITHER clears.
    # avg path -- needs a real sample to trust a rate:
    min_ab_avg: 5      # at-bats floor for the avg paths
    hot_avg: 0.350     # "owns this pitcher"
    cold_avg: 0.150    # "has been overmatched"
    # hr path -- 2+ career HR is signal even in a small sample, so its own lower floor:
    min_ab_hr: 3       # at-bats floor for the HR path
    min_hr: 2

betting_signals:
  mlb:
    # Score below which a bet type reports "No clear lean" instead of a side.
    min_threshold: 15
    # Run Line needs a stronger lean (the favorite must cover 1.5 runs).
    run_line_threshold: 35
    # A game's single most-notable market must clear THIS (much stricter than the
    # per-market lean thresholds above) before the AI writes a one-sentence
    # betting_note about it. Below it, no betting prose is written at all.
    #
    # Recalibrated twice on real simulation, never guessed. 50 -> 20 when the
    # bet_types weights below became reliability-proportional (concentrating weight
    # on fewer, more reliable signals raises every score, so 50 was measuring a
    # different scale). Then 20 -> 15 when season_series was dropped, which removes
    # the largest single weight from the two side markets and lowers their scores
    # again.
    #
    # 15 is the CLOSEST REACHABLE value, not a free choice. Production before this
    # change carried 928 of 1,388 real 2026 games (66.9%). Without season_series
    # the slate plateaus at 850 (61.2%) and no lower standout_threshold recovers
    # the rest: min_threshold (15) already drops any market below it from
    # list_markets, so top_market cannot return one, and 15 is where the two
    # thresholds meet. The remaining 78-game shortfall is structural -- games where
    # no market carries a lean at all rose from 304 to 538, because _finalize needs
    # >=2 signals agreeing with the net direction and the side markets just went
    # from four signals to three. Recovering those would mean moving min_threshold
    # or that guard, which is a separate decision and not made here.
    #
    # NOTE this now EQUALS min_threshold, so the standout is simply the
    # highest-scoring market that carries any lean at all. The stricter-than-lean
    # distinction the two thresholds used to express no longer exists.
    standout_threshold: 15
    # tanh normalization: `*_gap` = the home-vs-away spread that reads as a
    # meaningful edge; `*_total`/`*_solo` = league baseline + spread for
    # over/under-style magnitudes.
    scales:
      ops_gap: 0.080
      bullpen_gap: 1.50
      era_gap: 1.20
      ops_total: { base: 1.45, scale: 0.15 }
      starter_total: { base: 8.0, scale: 2.5 }
      bullpen_total: { base: 8.0, scale: 3.0 }
      ops_solo: { base: 0.725, scale: 0.080 }
      era_solo: { base: 4.0, scale: 1.20 }
      bullpen_solo: { base: 4.0, scale: 1.50 }
    # Per bet type: which base signals feed it and their weights. Bullpen is
    # excluded from the first-five markets (relievers rarely pitch in the first
    # five innings); NRFI/YRFI and totals lean toward more runs on the (+) side.
    #
    # RELIABILITY-PROPORTIONAL. Each weight below is a domain base split scaled by
    # the MEASURED reliability of the signal family it names, then renormalized:
    #     starter ERA 0.252 · team OPS 0.189 · bullpen ERA 0.071
    # Those come from this repo's own data (predictive validity against real runs,
    # corrected for the ceiling any team-level predictor can reach).
    #
    # season_series was the fourth family and has been REMOVED, not shrunk. It was
    # measured the same way the other three were, against real 2026 games, and it
    # carries no usable signal:
    #   * point-biserial r with the real home/away result = -0.02, 95% CI
    #     [-0.083, +0.042] -- not significant, and the point estimate is the WRONG
    #     SIGN. Bootstrap P(r > 0) = 0.26.
    #   * adding it to a model already holding the other three does nothing:
    #     likelihood-ratio test p = 0.291, AUC +0.0016, pseudo-R2 +0.0008.
    #   * it does not exist in 29% of games (the teams have not met yet), so the
    #     market silently re-weighted around it for a third of the season.
    #   * where it does exist the median sample is 2 games, 65% sit at the maximum
    #     +/-1.0, and 42% of those are ONE game -- it was the only base signal used
    #     raw, with no tanh scale and no shrinkage.
    # Shrinking it was not a coherent alternative: the natural centre of a
    # head-to-head differential is 0, so shrinking toward that with a median
    # sample of 2 games is removal by a longer route.
    #
    # Removed weight is NOT redistributed. _raw_lean renormalizes by the weight
    # sum, so only relative weights matter; redistributing would actively promote
    # whatever family received it rather than leave the rest in place. A key simply
    # absent from a market's dict is never looked up -- no scoring-code change is
    # needed to drop a family.
    bet_types:
      moneyline:
        team_ops: 0.378
        bullpen_era: 0.118
        probable_era: 0.504
      # No longer a copy of moneyline. A run line needs a DECISIVE margin, which
      # tracks the starting-pitching mismatch more than a narrow team-quality
      # edge, so the base split leans starter (ops 0.25 / pen 0.20 / starter 0.40)
      # before the same reliability scaling is applied.
      run_line:
        team_ops: 0.291
        bullpen_era: 0.088
        probable_era: 0.621
      game_total:
        combined_ops: 0.377
        combined_starter_era: 0.502
        combined_bullpen_era: 0.121
      first_five_moneyline:
        probable_era: 0.677
        team_ops: 0.323
      first_five_total:
        combined_starter_era: 0.667
        combined_ops: 0.333
      # No longer a copy of first_five_total. First-inning runs are the starter
      # facing the top of the order once -- the bullpen never appears and a
      # full-game team OPS is a weak proxy for one inning -- so the base split is
      # 0.75/0.25 before reliability scaling, against first_five_total's 0.60/0.40.
      nrfi_yrfi:
        combined_starter_era: 0.800
        combined_ops: 0.200
      team_total:
        team_ops: 0.502
        opp_bullpen_era: 0.126
        opp_starter_era: 0.372
  # Reserved for future sports (e.g. Premier League); empty = no betting layer.
  worldcup: {}

# Team Pulse -- a deterministic 0-100 notability score for ONE team, built from
# that team's own form against league average. Sport-keyed like the blocks above;
# mlb populated, other sports reserved empty (no block = no team pulse, and the
# Teams view simply renders nothing for that sport).
#
# `base` and `scale` are deliberately the SAME league-average constants the
# betting_signals scales already carry -- ops_solo for offense, bullpen_solo for
# the pen -- because they answer the same question ("where is league average, and
# how far from it is a meaningful move"). They are duplicated here rather than
# cross-referenced so this block stays readable on its own and so retuning the
# betting layer can't silently move the Teams view; if league average genuinely
# shifts, both should be updated together.
#
# `weight` splits the two components. They are renormalized over whichever
# components actually have data, so a team with no games in one window is scored
# on the other alone rather than being penalized for the gap or given a made-up
# value. A team with neither gets no pulse at all.
team_pulse:
  mlb:
    # Higher OPS is better. Matches betting_signals.mlb.scales.ops_solo.
    ops:
      base: 0.725
      scale: 0.080
      weight: 0.50
      window_days: 14
    # LOWER bullpen ERA is better -- the sign flip lives in code, same rule as
    # betting_signals' `favors` direction. Matches scales.bullpen_solo.
    bullpen:
      base: 4.00
      scale: 1.50
      weight: 0.50
      window_days: 7
  # Reserved for future sports; empty = the Teams view renders nothing.
  worldcup: {}

# ---------------------------------------------------------------------------
# Insights UI presentation, sport-keyed (mirrors betting_signals / player_angle).
# The Python build resolves these into data.json so the JS components stay
# sport-blind -- MLB fills its set now; NFL/NBA/CFB/PL get their own later
# WITHOUT touching component code. An empty/missing sport block simply means the
# config-driven affordances (category strip, comparison table) don't render for
# that sport; the generic pieces (pulse, signals, AI note) still do.
insights_ui:
  mlb:
    # Static category strip (icon names resolve to inline SVGs in the component's
    # registry -- config carries names/labels, never markup).
    signal_categories:
      - { key: starting_pitching, label: "Starting Pitching", icon: mound }
      - { key: bullpen,           label: "Bullpen Fatigue",    icon: relief }
      - { key: offense,           label: "Offense Form",       icon: bat }
    # Readable market names for the Signal Score list / Best Angle (replaces the
    # old hardcoded _BET_MARKET_LABELS in generate_insights.py). Keys match
    # betting_signals bet_types.
    market_labels:
      moneyline: "Moneyline"
      run_line: "Run Line"
      game_total: "Game Total"
      first_five_moneyline: "First Five Moneyline"
      first_five_total: "First Five Total"
      nrfi_yrfi: "First-Inning Runs"
      team_total: "Team Total"
    # Generic "compare N metrics between two entities" tables. `better` is the
    # winning direction; the build resolves which side wins per row. Metrics whose
    # data isn't in the pipeline yet are simply absent (K%/BB%/WHIP this phase).
    compare_sets:
      probable_starters:
        title: "Probable Starters"
        metrics:
          - { key: era, label: "ERA", format: era, better: low }
    # Implied-total label wording (the number/units the UI shows). Sport-specific
    # phrasing lives here, not in the JS.
    est_total:
      label: "Run Estimate"
      unit: "runs"
      note: "Rough model estimate from team form & pitching — not a betting line. No park, weather, or lineup data."
    # First five innings is its own, cruder model (starters only, no bullpen),
    # so it gets its own wording: the note names the assumption that actually
    # limits it rather than repeating the full-game caveats.
    first_five_total:
      label: "First Five Estimate"
      unit: "runs"
      note: "Rough model estimate from the probable starters — not a betting line. Assumes both starters work the first five; no bullpen, park, weather, or lineup data."
  # Reserved for future sports; empty = no config-driven affordances render.
  worldcup: {}
