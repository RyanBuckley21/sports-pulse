# sports-pulse config
# Declares which stat categories to track per sport and how to compute them.

output_dir: output
top_n: 10

# Sports the site actually builds and shows, in toggle order. Only these are
# fetched and written to data.json, and only if they are also registered in
# generate_stats.SPORT_FETCHERS -- listing a sport here that is not registered
# builds nothing. (The archived worldcup block below is exactly that case.)
# See docs/leagues.md.
#
# THIS KEY GATES THE LEADERBOARDS ONLY -- generate_stats.py's SPORT_FETCHERS
# pipeline ("Who's Hot": players ranked by raw production). The scored per-game
# picks (Signal Scores, weights, thresholds, graded outcomes, the ledger) are
# gated separately by `active_game_sports` below.
active_sports: [mlb]

# Sports whose SCORED PER-GAME PICKS are built -- generate_insights.py's
# GAME_BUILDERS pipeline. Deliberately a different key from `active_sports`
# above: the two were one list until they were split, which meant adding a
# sport to publish its leaderboards silently switched on its betting markets
# too. They are now independently gate-able in both directions -- leaderboards
# without picks, picks without leaderboards, or both.
#
# COMMENTED OUT ON PURPOSE. When this key is absent it falls back to
# `active_sports`, which reproduces the old shared-gate behaviour exactly, so
# production keeps resolving to [mlb] with nothing to migrate. Uncomment it
# only when the two lists genuinely need to differ -- e.g. to publish NFL
# leaderboards while keeping NFL betting markets off:
#
#     active_sports:      [mlb, nfl]
#     active_game_sports: [mlb]
#
# An explicitly EMPTY list (`active_game_sports: []`) is honoured as a real
# kill switch -- no scored picks for any sport -- rather than falling back.
# active_game_sports: [mlb]

# Kill switch for the AI Insights layer (generate_insights.py's `claude -p`
# prose + the JS AI Note blurb). false = no AI calls, no AI text in the UI --
# everything else (betting_signals, training_capture, boxscore cache, outcome
# resolution, deterministic pulse/signals/comparisons) keeps running. Flip
# back to true to re-enable; nothing about this flag deletes committed state.
ai_insights:
  enabled: false

mlb:
  base_url: https://statsapi.mlb.com/api/v1
  season: 2026
  window_games: 10        # rolling window size for counting stats
  candidate_pool_size: 40 # season leaders pulled per seed category before re-ranking on the rolling window
  recent_seed_days: 24    # date window (~20 games) for the recent-form pool seed
  recent_pool_size: 40    # top-N recent leaders unioned into the season pool

  stat_categories:
    - key: home_runs
      label: Home Runs (last 10 G)
      short_label: Home Runs
      unit: HR
      group: hitting
      mode: rolling_sum
      fields: [homeRuns]
      seed_leaderboards: [homeRuns]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: total_bases
      label: Total Bases per Game (last 10 G, true avg)
      short_label: Total Bases/G
      unit: TB/G
      group: hitting
      mode: rolling_sum
      fields: [totalBases]
      per_game: true
      seed_leaderboards: [totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: hits_runs_rbi
      label: Hits + Runs + RBI per Game (last 10 G, true avg)
      short_label: H+R+RBI/G
      unit: H+R+RBI/G
      group: hitting
      mode: rolling_sum
      fields: [hits, runs, rbi]
      per_game: true
      seed_leaderboards: [hits, runs, runsBattedIn]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: strikeouts
      label: "Strikeouts per Game (last 10 G, today's starters only, true avg)"
      short_label: K/G (Starters)
      unit: K/G
      group: pitching
      mode: rolling_sum
      fields: [strikeOuts]
      per_game: true
      starters_only: true
      window_games: 10

    - key: hit_streak
      label: Active Hit Streak
      short_label: Hit Streak
      unit: GAMES
      group: hitting
      mode: hit_streak
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    # threshold_rate: how often a player clears a per-game bar within a
    # recent window. `fields` are summed per game, compared to `threshold`;
    # `min_games` is a small-sample qualification floor (fewer games in the
    # window than this and the player is dropped from ranking entirely).
    - key: hit_rate
      label: Hit Rate (games with 1+ hit, last 20 G)
      short_label: Hit Rate
      unit: "1+H"
      group: hitting
      mode: threshold_rate
      fields: [hits]
      threshold: 1
      window_games: 20
      min_games: 16
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    - key: run_producer_rate
      label: Run Producer Rate (games with 2+ H/R/RBI, last 20 G)
      short_label: Run Producer
      unit: "2+HRR"
      group: hitting
      mode: threshold_rate
      fields: [hits, runs, rbi]
      threshold: 2
      window_games: 20
      min_games: 16
      seed_leaderboards: [hits, runs, runsBattedIn, homeRuns, totalBases]
      recent_seed_leaderboards: [hits, totalBases]  # union recent-form leaders so hot low-volume hitters qualify

    # window_starts_only: the window counts a pitcher's actual starts (games
    # with gamesStarted >= 1), not calendar games, so relief cameos don't
    # dilute a starter's last-10-starts rate.
    - key: k_rate
      label: K Rate (starts with 6+ K, last 10 starts)
      short_label: K Rate
      unit: "6+K"
      group: pitching
      mode: threshold_rate
      fields: [strikeOuts]
      threshold: 6
      window_games: 10
      min_games: 6
      starters_only: true
      window_starts_only: true

# NFL "Who's Hot" leaderboard categories (fetchers/nfl.py's fetch(), via
# generate_stats.SPORT_FETCHERS). Structurally parallel to the mlb block above.
#
# THIS IS A DIFFERENT NAMESPACE FROM `betting_signals.nfl` further down, and
# the two must not be conflated. This block describes leaderboards: which raw
# stats to rank players by, over what window. That block describes a scored
# betting market: weights, scales, conviction thresholds. Nothing here is a
# weight and nothing here is graded against an outcome.
#
# Not fetched or shown while `nfl` is absent from active_sports (same gate the
# worldcup block below sits behind).
nfl:
  season: 2025
  # Most recent games a player ACTUALLY PLAYED, not calendar weeks -- so a bye
  # week or an inactive week shifts the window back rather than punching a hole
  # in it. 4 is about a quarter of a 17-game season; MLB's last-10-of-162 is
  # about 6%. There is no NFL window that reproduces that proportion (6% of 17
  # is one game), so an NFL board is inherently less "recent-form" and more
  # "recent-season" than an MLB one. That is a property of the sport, not a
  # tuning choice to be corrected later.
  window_games: 4

  stat_categories:
    # ---- per-game rate boards (per_game: true) ----------------------------
    # min_games: 2 -- enough to kill a one-game fluke topping a board, low
    # enough that boards appear from week 2 and that a player returning from a
    # bye still qualifies. Measured on real 2024 data (weeks 6-9), requiring a
    # full 4-of-4 window would have discarded ~40% of otherwise-qualified
    # receivers, most of them simply on bye.
    - key: passing_yards
      label: Passing Yards per Game (last 4 G)
      short_label: Pass Yds/G
      unit: YDS/G
      mode: rolling_sum
      fields: [passing_yards]
      per_game: true
      min_games: 2

    # positions: RB -- measured across all 15 four-week windows of 2024, a
    # mobile QB cracked the rushing top 10 in 3 of them (Lamar Jackson twice,
    # Jayden Daniels once), always at rank 9-10. Correct numbers, but "top
    # rushers" listing a QB reads as a bug to a football audience, so the board
    # is filtered to the position it claims to rank.
    - key: rushing_yards
      label: Rushing Yards per Game (last 4 G, RB only)
      short_label: Rush Yds/G
      unit: YDS/G
      mode: rolling_sum
      fields: [rushing_yards]
      per_game: true
      min_games: 2
      positions: [RB]

    # WR/TE for the two receiving boards: pass-catching RBs otherwise land on
    # a board that reads as a wideout ranking. Same reasoning as rushing above.
    - key: receiving_yards
      label: Receiving Yards per Game (last 4 G, WR/TE only)
      short_label: Rec Yds/G
      unit: YDS/G
      mode: rolling_sum
      fields: [receiving_yards]
      per_game: true
      min_games: 2
      positions: [WR, TE]

    - key: receptions
      label: Receptions per Game (last 4 G, WR/TE only)
      short_label: Rec/G
      unit: REC/G
      mode: rolling_sum
      fields: [receptions]
      per_game: true
      min_games: 2
      positions: [WR, TE]

    # ---- counting boards (touchdowns) ------------------------------------
    # tiebreak_fields: a TD board over four games is a small integer, so ties
    # pile up (a dozen players at 2 TDs is a normal week). Without a tiebreak
    # those resolve in arbitrary dict order; the underlying yardage settles
    # them on real production, reusing rank_records' existing `tiebreak` key.
    #
    # min_games: 2 applies here as well as to the rate boards. It was raised
    # in review as an addition beyond the originally-locked decision (which
    # named a floor only for the per-game rate boards) and was RATIFIED: a
    # counting board with no floor lets a single-game player top it -- one
    # 3-TD game beats everyone else's four-game total of 2 -- which is the
    # exact failure the rate boards' floor exists to prevent.
    #
    # These four boards are deliberately NOT position-filtered: the locked
    # decision named only the three yardage/reception boards. The visible
    # consequence is that rushing QBs and receiving RBs DO appear here.
    - key: passing_tds
      label: Passing TDs (last 4 G)
      short_label: Pass TD
      unit: TD
      mode: rolling_sum
      fields: [passing_tds]
      tiebreak_fields: [passing_yards]
      min_games: 2

    - key: rushing_tds
      label: Rushing TDs (last 4 G)
      short_label: Rush TD
      unit: TD
      mode: rolling_sum
      fields: [rushing_tds]
      tiebreak_fields: [rushing_yards]
      min_games: 2

    - key: receiving_tds
      label: Receiving TDs (last 4 G)
      short_label: Rec TD
      unit: TD
      mode: rolling_sum
      fields: [receiving_tds]
      tiebreak_fields: [receiving_yards]
      min_games: 2

    - key: total_tds
      label: Total TDs (rushing + receiving, last 4 G)
      short_label: Total TD
      unit: TD
      mode: rolling_sum
      fields: [rushing_tds, receiving_tds]
      tiebreak_fields: [rushing_yards, receiving_yards]
      min_games: 2

# Premier League "Who's Hot" leaderboard categories (fetchers/epl.py's
# fetch(), via generate_stats.SPORT_FETCHERS). Structurally parallel to the
# mlb and nfl blocks above.
#
# LEADERBOARD ONLY. There is deliberately NO `betting_signals.epl` block
# anywhere in this file, and no EPL entry in generate_insights.GAME_BUILDERS.
# Nothing here is a weight, a conviction threshold, or graded against an
# outcome. Its absence is the clearest available statement of that boundary.
#
# Not fetched or shown while `epl` is absent from active_sports.
epl:
  scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard
  summary_url: https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary

  # A player's most recent 5 APPEARANCES, not matchdays -- rotation, injury
  # and suspension shift the window back rather than leaving gaps.
  #
  # 5, not NFL's 4: goals are low-frequency, and over four matches a striker's
  # total is often 0-3, too coarse to separate a board. 5 of 38 is ~13% of a
  # season, between NFL's 4-of-17 (~24%) and MLB's 10-of-162 (~6%).
  window_games: 5
  # Calendar span searched to find those appearances. Generous on purpose: a
  # rotated or recently-injured player needs a wider span to accumulate five,
  # and matches outside every player's window are simply never selected.
  # Each match in range costs one summary call (~8s per 50 matches measured).
  lookback_days: 75

  stat_categories:
    # ---- unfiltered boards ------------------------------------------------
    # No position filter: a goal counts the same whoever scores it, so these
    # are the boards where bench-only players (16% of the pool, whose real
    # position ESPN never reports -- see fetchers/epl.stable_position) stay
    # fully eligible.
    #
    # min_games: 3, not NFL's 2. EPL rotation is heavier -- cup and European
    # fixtures plus a congested festive period mean a fringe player can make
    # two short cameos in a five-match span, and a 2-game floor would let that
    # top a board.
    - key: goals
      label: Goals (last 5 appearances)
      short_label: Goals
      unit: G
      mode: rolling_sum
      fields: [totalGoals]
      min_games: 3

    - key: assists
      label: Assists (last 5 appearances)
      short_label: Assists
      unit: A
      mode: rolling_sum
      fields: [goalAssists]
      min_games: 3

    - key: goal_or_assist
      label: Goal Contributions (last 5 appearances)
      short_label: Goal Contributions
      unit: G+A
      mode: rolling_sum
      fields: [totalGoals, goalAssists]
      min_games: 3

    # ---- attacking boards, Forward/Midfielder only ------------------------
    # Filtered because these rank attacking output: a defender or keeper on
    # the same board is not a meaningful comparison. Position is resolved as
    # the player's modal non-bench position across the window, so a striker
    # who came off the bench once is still a Forward.
    #
    # per_appearance -- NOT per 90, and the label must never say otherwise.
    # ESPN's payload carries no minutes played, only an appearances flag, so a
    # 10-minute cameo and a full 90 count identically. Naming this "per 90"
    # would claim a normalisation the data cannot support.
    - key: goals_per_appearance
      label: Goals per Appearance (last 5 appearances, Fwd/Mid)
      short_label: Goals/App
      unit: G/APP
      mode: rolling_sum
      fields: [totalGoals]
      per_appearance: true
      min_games: 3
      positions: [Forward, Midfielder]

    - key: shots_on_goal
      label: Shots on Target (last 5 appearances, Fwd/Mid)
      short_label: Shots on Target
      unit: SOT
      mode: rolling_sum
      fields: [shotsOnTarget]
      min_games: 3
      positions: [Forward, Midfielder]

    # ---- goalkeeper boards ------------------------------------------------
    # cleanSheets is not an ESPN field. It is derived per match by
    # fetchers/epl.extract_clean_sheet_credits, which credits a starting
    # keeper only when they conceded nothing AND were never subbed off AND no
    # goalkeeper substitution occurred for their team -- because goalsConceded
    # alone is ambiguous when a backup comes on. The adjacent shotsFaced field
    # is outright wrong (a keeper conceding 2 with 1 save reported 0), which is
    # why no board is built on it.
    - key: clean_sheets
      label: Clean Sheets (last 5 appearances, GK)
      short_label: Clean Sheets
      unit: CS
      mode: rolling_sum
      fields: [cleanSheets]
      min_games: 3
      positions: [Goalkeeper]

    - key: saves
      label: Saves (last 5 appearances, GK)
      short_label: Saves
      unit: SV
      mode: rolling_sum
      fields: [saves]
      min_games: 3
      positions: [Goalkeeper]

# ARCHIVED -- the 2026 tournament is over and the next cycle is ~2030. This
# block is KEPT (nothing here is deleted) but the sport is no longer REGISTERED
# in generate_stats.py: its SPORT_FETCHERS, SPORT_LABELS, APPROVED_CATEGORIES
# and CATEGORY_META entries were removed so its category keys (goals, assists,
# shots, ...) stop occupying those flat, sport-agnostic namespaces and a real
# soccer league can claim them.
#
# Consequence worth knowing: adding `worldcup` back to active_sports is NO
# LONGER ENOUGH on its own -- with no SPORT_FETCHERS entry, main() logs
# "no fetcher registered" and builds nothing. See docs/leagues.md's
# "Reviving it for 2030" for the full checklist.
worldcup:
  competition: FIFA World Cup 2026
  scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard
  summary_url: https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary

  stat_categories:
    - key: shots
      label: Total Shots per Game (tournament, true avg)
      short_label: Total Shots/Game
      unit: SH/G
      mode: tournament_total
      fields: [totalShots]
      per_game: true

    - key: shots_on_goal
      label: Shots on Goal per Game (tournament, true avg)
      short_label: Shots on Goal/G
      unit: SOG/G
      mode: tournament_total
      fields: [shotsOnTarget]
      per_game: true

    - key: goals
      label: Goals (tournament)
      short_label: Goals
      unit: G
      mode: tournament_total
      fields: [totalGoals]

    - key: goal_or_assist
      label: Goal Involvements (tournament)
      short_label: Goal Involvements
      unit: G+A
      mode: tournament_total
      fields: [totalGoals, goalAssists]

    - key: assists
      label: Assists (tournament)
      short_label: Assists
      unit: A
      mode: tournament_total
      fields: [goalAssists]

    - key: clean_sheets
      label: Clean Sheets (tournament, starting GK, full match only)
      short_label: Clean Sheets
      unit: CS
      mode: tournament_total
      fields: [cleanSheets]

# Betting Signal Layer -- deterministic per-game Signal Scores per bet type,
# computed by betting_signals.py from the Game builder's existing inputs (14d
# OPS, 7d bullpen ERA, probable-starter ERA, season series) plus availability.
# Sport-keyed: mlb populated, other sports reserved empty. All values are v1,
# tunable (see the design proposal). `favors` direction per metric is intrinsic
# and lives in code, not here; this block holds weights, scales, and thresholds.
# Player matchup_note gate: the player's CAREER line vs the pitcher they face
# next gets a one-sentence AI note ONLY when it clears this bar (enough sample AND
# lopsided enough to matter). Provisional v1 -- tuned against a real-data hit-rate
# check. vs-pitcher history is inherently sparse, so notes fire selectively.
player_angle:
  mlb:
    # Two INDEPENDENT gates; the angle fires if EITHER clears.
    # avg path -- needs a real sample to trust a rate:
    min_ab_avg: 5      # at-bats floor for the avg paths
    hot_avg: 0.350     # "owns this pitcher"
    cold_avg: 0.150    # "has been overmatched"
    # hr path -- 2+ career HR is signal even in a small sample, so its own lower floor:
    min_ab_hr: 3       # at-bats floor for the HR path
    min_hr: 2

betting_signals:
  mlb:
    # Score below which a bet type reports "No clear lean" instead of a side.
    min_threshold: 15
    # Run Line needs a stronger lean (the favorite must cover 1.5 runs).
    run_line_threshold: 35
    # A game's single most-notable market must clear THIS (much stricter than the
    # per-market lean thresholds above) before the AI writes a one-sentence
    # betting_note about it. Below it, no betting prose is written at all.
    #
    # Recalibrated twice on real simulation, never guessed. 50 -> 20 when the
    # bet_types weights below became reliability-proportional (concentrating weight
    # on fewer, more reliable signals raises every score, so 50 was measuring a
    # different scale). Then 20 -> 15 when season_series was dropped, which removes
    # the largest single weight from the two side markets and lowers their scores
    # again.
    #
    # 15 is the CLOSEST REACHABLE value, not a free choice. Production before this
    # change carried 928 of 1,388 real 2026 games (66.9%). Without season_series
    # the slate plateaus at 850 (61.2%) and no lower standout_threshold recovers
    # the rest: min_threshold (15) already drops any market below it from
    # list_markets, so top_market cannot return one, and 15 is where the two
    # thresholds meet. The remaining 78-game shortfall is structural -- games where
    # no market carries a lean at all rose from 304 to 538, because _finalize needs
    # >=2 signals agreeing with the net direction and the side markets just went
    # from four signals to three. Recovering those would mean moving min_threshold
    # or that guard, which is a separate decision and not made here.
    #
    # Then 15 -> 17 when first_five_total was retired and nrfi_yrfi was reduced to
    # its single surviving signal. That was NOT expected to move the slate much --
    # first_five_total won only 16 of 850 slots -- but simulated it moved a lot:
    # nrfi_yrfi's lean is now the undiluted combined_starter_era signal, so its
    # scores rose and it took 104 -> 322 slots, pushing the slate to 960 (69.2%)
    # at the old 15. 17 brings it back to 861 of 1,388 (62.0%) against production's
    # 850 (61.2%), eleven games apart. Worth recording that "this market rarely
    # wins a slot" did not imply "removing it barely moves the threshold".
    #
    # At 17 the standout bar is once again above min_threshold (15), so the
    # stricter-than-lean distinction the two thresholds express is restored --
    # it had collapsed when they were briefly equal.
    standout_threshold: 17
    # tanh normalization: `*_gap` = the home-vs-away spread that reads as a
    # meaningful edge; `*_total`/`*_solo` = league baseline + spread for
    # over/under-style magnitudes.
    scales:
      ops_gap: 0.080
      bullpen_gap: 1.50
      era_gap: 1.20
      ops_total: { base: 1.45, scale: 0.15 }
      starter_total: { base: 8.0, scale: 2.5 }
      bullpen_total: { base: 8.0, scale: 3.0 }
      ops_solo: { base: 0.725, scale: 0.080 }
      era_solo: { base: 4.0, scale: 1.20 }
      bullpen_solo: { base: 4.0, scale: 1.50 }
    # Per bet type: which base signals feed it and their weights. Bullpen is
    # excluded from the first-five markets (relievers rarely pitch in the first
    # five innings); NRFI/YRFI and totals lean toward more runs on the (+) side.
    #
    # RELIABILITY-PROPORTIONAL. Each weight below is a domain base split scaled by
    # the MEASURED reliability of the signal family it names, then renormalized:
    #     starter ERA 0.252 · team OPS 0.189 · bullpen ERA 0.071
    # Those come from this repo's own data (predictive validity against real runs,
    # corrected for the ceiling any team-level predictor can reach).
    #
    # season_series was the fourth family and has been REMOVED, not shrunk. It was
    # measured the same way the other three were, against real 2026 games, and it
    # carries no usable signal:
    #   * point-biserial r with the real home/away result = -0.02, 95% CI
    #     [-0.083, +0.042] -- not significant, and the point estimate is the WRONG
    #     SIGN. Bootstrap P(r > 0) = 0.26.
    #   * adding it to a model already holding the other three does nothing:
    #     likelihood-ratio test p = 0.291, AUC +0.0016, pseudo-R2 +0.0008.
    #   * it does not exist in 29% of games (the teams have not met yet), so the
    #     market silently re-weighted around it for a third of the season.
    #   * where it does exist the median sample is 2 games, 65% sit at the maximum
    #     +/-1.0, and 42% of those are ONE game -- it was the only base signal used
    #     raw, with no tanh scale and no shrinkage.
    # Shrinking it was not a coherent alternative: the natural centre of a
    # head-to-head differential is 0, so shrinking toward that with a median
    # sample of 2 games is removal by a longer route.
    #
    # first_five_total was RETIRED as a scored market, not reweighted. Its
    # Over/Under lean is a weighted blend of combined_starter_era and
    # combined_ops; implied_total.first_five_estimate() computes the `point` it is
    # graded against from away_ops/home_ops/away_sp/home_sp -- the same four raw
    # numbers. Measured, the lean correlates +0.78 with its own point estimate, so
    # a stronger lean RAISES the bar it has to clear. Against the real Over/Under
    # outcome over 1,199 games it scored r=-0.0199, 95% CI [-0.077, +0.037], with
    # its dominant starter component at r=-0.0276. That is not a weak market to be
    # retuned; the circularity is in the target definition, so no reweighting can
    # fix it. The estimate itself is still computed and shown as information.
    #
    # Removed weight is NOT redistributed. _raw_lean renormalizes by the weight
    # sum, so only relative weights matter; redistributing would actively promote
    # whatever family received it rather than leave the rest in place. A key simply
    # absent from a market's dict is never looked up -- no scoring-code change is
    # needed to drop a family.
    bet_types:
      moneyline:
        team_ops: 0.378
        bullpen_era: 0.118
        probable_era: 0.504
      # No longer a copy of moneyline. A run line needs a DECISIVE margin, which
      # tracks the starting-pitching mismatch more than a narrow team-quality
      # edge, so the base split leans starter (ops 0.25 / pen 0.20 / starter 0.40)
      # before the same reliability scaling is applied.
      run_line:
        team_ops: 0.291
        bullpen_era: 0.088
        probable_era: 0.621
      game_total:
        combined_ops: 0.377
        combined_starter_era: 0.502
        combined_bullpen_era: 0.121
      first_five_moneyline:
        probable_era: 0.677
        team_ops: 0.323
      # First-inning runs are the starter facing the top of the order once, so the
      # bullpen never appears and a full-game team OPS is a weak proxy for one
      # inning. Measured against the real YRFI outcome over 1,388 games,
      # combined_ops contributed nothing -- r=+0.0169 with a 95% CI spanning zero
      # -- while combined_starter_era ALONE (r=+0.0605, CI [+0.008, +0.113])
      # measured BETTER than the 0.80/0.20 blend it was part of (r=+0.0588). The
      # OPS term was diluting, not helping, so it is dropped rather than shrunk:
      # nothing reliable was there to preserve. A single-signal market is fine --
      # _finalize's >=2-agreeing guard is bypassed when n_avail < 2.
      nrfi_yrfi:
        combined_starter_era: 1.0
      team_total:
        team_ops: 0.502
        opp_bullpen_era: 0.126
        opp_starter_era: 0.372
  # NFL -- moneyline only, v1 (see nfl_signals.py; run against fetchers/nfl.py's
  # nflverse-derived team form). NOT in active_sports yet -- built, wired, and
  # NOW BACKTEST-CALIBRATED, but still not live; going live in active_sports
  # is a separate decision made after these numbers have been reviewed, same
  # staged-rollout precedent worldcup already sets below.
  #
  # CALIBRATED against real 2021-2025 seasons (nfl_backtest.py), the same
  # "measure, don't guess" discipline mlb's own weights/scales/threshold
  # history above documents -- but this is a SINGLE BACKTEST PASS, not months
  # of live production measurement the way mlb's numbers are. Treat every
  # value below as a first-pass starting point subject to revision once real
  # production data accumulates, exactly like mlb's standout_threshold walked
  # 50 -> 20 -> 15 -> 17 as its signal set changed under it -- this is where
  # that walk STARTS for NFL, not where it ends.
  #
  # Measured against 1,424 real games (1,359 regular season + 65 postseason,
  # 2021-2025): point-biserial r of each signal's direction-corrected raw
  # gap against the real home-win outcome, with a 2000-sample bootstrap 95%
  # CI. Two signals are NOT in bet_types.moneyline below, for two DIFFERENT
  # reasons kept distinct on purpose:
  #   * rest_diff -- DROPPED. r=+0.0417, 95% CI [-0.0100, +0.0924] spans
  #     zero: not distinguishable from no signal at all. Same treatment
  #     mlb's season_series got once measured (r=-0.02, also dropped, not
  #     shrunk).
  #   * scoring_margin -- EXCLUDED, not dropped. Its own correlation clears
  #     zero cleanly (r=+0.2245, CI [+0.1723, +0.2776]) -- the reason it's
  #     out is NOT that it doesn't predict anything, it measurably does.
  #     It is heavily collinear with the signals that survive: r=+0.71 with
  #     off_epa, +0.60 with def_epa_allowed, +0.50 with turnover_diff
  #     (pairwise correlation among the signals THEMSELVES, not vs.
  #     outcome) -- expected, since a team's scoring margin is largely a
  #     restatement of what its EPA numbers already capture, aggregated
  #     differently. Reliability-proportional weighting assumes each
  #     signal is INDEPENDENT evidence; scoring_margin measurably is not,
  #     so including it would double-count the same underlying "team
  #     quality" information under two different names. No equivalent
  #     multivariate check (partial correlation / logistic regression
  #     controlling for the other signals) was run to confirm this more
  #     rigorously -- this was a judgment call from the pairwise-correlation
  #     table, not a statistical drop, and is flagged as the single biggest
  #     open methodological question in this calibration.
  #
  # Survivors' weights are r^2 (variance explained), renormalized to sum to
  # 1 -- NOT ceiling-corrected the way mlb's weights are (mlb's account for
  # "the ceiling any team-level predictor can reach", established against
  # this repo's own multi-month MLB production data; an equivalent NFL
  # ceiling has not been established, so this is plain reliability-
  # proportional weighting, not ceiling-corrected reliability):
  #     off_epa r=+0.2473 -> 0.8380 · turnover_diff r=+0.0851 -> 0.0992 ·
  #     def_epa_allowed r=+0.0677 -> 0.0628
  # off_epa's weight looks stark relative to the other two because r^2
  # weighting is sensitive to relative gaps, not because the other two were
  # judged unimportant -- both cleared their own CI independently.
  #
  # scales are the measured sample stdev of each signal's own raw home-away
  # gap (replacing the earlier ballpark placeholders). All five are still
  # populated, including scoring_margin's and rest_diff's -- nfl_signals.
  # _base_signals computes a directional value for every SIGNAL_SPECS entry
  # unconditionally and divides by its scale, whether or not that entry is
  # ever looked up by a bet_type's weights.
  #
  # min_threshold/standout_threshold recomputed from the resulting score
  # distribution under the NEW (3-signal) weights -- the distribution shifts
  # whenever the weights do, so the OLD threshold from a different weight
  # set would not mean the same thing here. 50 is the largest threshold in
  # the tested sensitivity table (0/5/.../70) that still keeps >=33% of the
  # 1,424 games gradeable (552, 38.8%), and it also happened to be a local
  # peak in win rate (67.8%) rather than a step down from a nearby option --
  # not a coincidence this backtest engineered for, just what the table
  # showed. Set equal (v1 has exactly one market, so there is no second,
  # noisier market for standout_threshold to be stricter than the way mlb's
  # run_line/nrfi_yrfi give its two thresholds room to differ).
  #
  # FINAL GRADED RESULT under these weights/thresholds, outcome-graded (real
  # final scores, not an estimate): 374-178 (67.8%) on 552 decided picks,
  # combined. Regular season alone: 363-173 (67.7%) on 536 decided picks.
  # POSTSEASON: 11-5 (68.8%) on just 16 decided picks -- reported because
  # postseason play can differ meaningfully from the regular season, NOT
  # because 16 picks is enough to independently validate or refute that;
  # read it as "here is what the same model does on playoff games," not as
  # its own settled finding. Naive always-pick-home baseline over the same
  # 2021-2025 window: 54.6% (776/1420 decided games) -- the calibrated model
  # clears that baseline at every threshold tested, combined and regular-
  # season alike.
  nfl:
    min_threshold: 50
    standout_threshold: 50
    scales:
      off_epa_gap: 0.1566
      def_epa_gap: 0.1356
      turnover_gap: 1.1357
      margin_gap: 10.1113
      rest_gap: 2.3662
    bet_types:
      moneyline:
        off_epa: 0.8380
        turnover_diff: 0.0992
        def_epa_allowed: 0.0628
  # ------------------------------------------------------------------------ #
  # CFB (FBS) -- EVERY NUMBER BELOW IS A FLAT, PRE-CALIBRATION PLACEHOLDER.
  #
  # Nothing here has been backtested against anything. This block is the exact
  # counterpart of the nfl block as it shipped in PR #34, before PR #35
  # measured reliability and replaced it: equal weights across the available
  # signals, round-number scales, and a near-zero threshold. Read every value
  # as "not yet measured", not as a tuned number. The calibration pass is its
  # own follow-up PR, same sequencing NFL had.
  #
  # Weights are EQUAL (1/3 each) on purpose. Hand-picking a starting split
  # would bake in a guess that the backtest then has to argue its way out of;
  # a flat prior is the honest starting point and makes the calibration
  # delta interpretable.
  cfb:
    # Deliberately near-zero, same reasoning as NFL's initial block: with
    # nothing measured yet the goal is a large gradeable sample for the
    # backtest, not a defensible live cutoff. The >=2-signals-agree guard in
    # cfb_signals._finalize is the real gate at this threshold, not the score
    # -- and unlike NFL's, that guard has no override that can bypass it,
    # because CFB has no availability input. See cfb_signals._finalize.
    min_threshold: 1
    standout_threshold: 1
    # Round-number placeholders, NOT measured league dispersion. PPA is a
    # per-play rate on roughly the same scale as NFL's EPA/play, so the two
    # PPA gaps start from NFL's pre-calibration 0.10; college football's
    # talent spread is far wider than the NFL's, so these are the values most
    # likely to move under calibration.
    scales:
      off_ppa_gap: 0.10
      def_ppa_gap: 0.10
      turnover_gap: 0.50
    bet_types:
      # Moneyline only in v1. Three signals, matching what CFBD's bulk
      # endpoints publish per team-game. Scoring margin is deliberately
      # absent: NFL's calibration found it strongly collinear with offensive
      # EPA and dropped it, so CFB ships it unweighted in each game's
      # `context` (see fetchers/cfb.build_scoring_margins) where the backtest
      # can measure it without it moving a live pick first.
      moneyline:
        off_ppa: 0.3333
        def_ppa_allowed: 0.3333
        turnover_diff: 0.3334
  # Reserved for future sports (e.g. Premier League); empty = no betting layer.
  worldcup: {}

# Team Pulse -- a deterministic 0-100 notability score for ONE team, built from
# that team's own form against league average. Sport-keyed like the blocks above;
# mlb populated, other sports reserved empty (no block = no team pulse, and the
# Teams view simply renders nothing for that sport).
#
# `base` and `scale` are deliberately the SAME league-average constants the
# betting_signals scales already carry -- ops_solo for offense, bullpen_solo for
# the pen -- because they answer the same question ("where is league average, and
# how far from it is a meaningful move"). They are duplicated here rather than
# cross-referenced so this block stays readable on its own and so retuning the
# betting layer can't silently move the Teams view; if league average genuinely
# shifts, both should be updated together.
#
# `weight` splits the two components. They are renormalized over whichever
# components actually have data, so a team with no games in one window is scored
# on the other alone rather than being penalized for the gap or given a made-up
# value. A team with neither gets no pulse at all.
team_pulse:
  mlb:
    # Higher OPS is better. Matches betting_signals.mlb.scales.ops_solo.
    ops:
      base: 0.725
      scale: 0.080
      weight: 0.50
      window_days: 14
    # LOWER bullpen ERA is better -- the sign flip lives in code, same rule as
    # betting_signals' `favors` direction. Matches scales.bullpen_solo.
    bullpen:
      base: 4.00
      scale: 1.50
      weight: 0.50
      window_days: 7
  # Reserved for future sports; empty = the Teams view renders nothing.
  worldcup: {}

# ---------------------------------------------------------------------------
# Insights UI presentation, sport-keyed (mirrors betting_signals / player_angle).
# The Python build resolves these into data.json so the JS components stay
# sport-blind -- MLB fills its set now; NFL/NBA/CFB/PL get their own later
# WITHOUT touching component code. An empty/missing sport block simply means the
# config-driven affordances (category strip, comparison table) don't render for
# that sport; the generic pieces (pulse, signals, AI note) still do.
insights_ui:
  mlb:
    # Static category strip (icon names resolve to inline SVGs in the component's
    # registry -- config carries names/labels, never markup).
    signal_categories:
      - { key: starting_pitching, label: "Starting Pitching", icon: mound }
      - { key: bullpen,           label: "Bullpen Fatigue",    icon: relief }
      - { key: offense,           label: "Offense Form",       icon: bat }
    # Readable market names for the Signal Score list / Best Angle (replaces the
    # old hardcoded _BET_MARKET_LABELS in generate_insights.py). Keys match
    # betting_signals bet_types.
    market_labels:
      moneyline: "Moneyline"
      run_line: "Run Line"
      game_total: "Game Total"
      first_five_moneyline: "First Five Moneyline"
      first_five_total: "First Five Total"
      nrfi_yrfi: "First-Inning Runs"
      team_total: "Team Total"
    # Generic "compare N metrics between two entities" tables. `better` is the
    # winning direction; the build resolves which side wins per row. Metrics whose
    # data isn't in the pipeline yet are simply absent (K%/BB%/WHIP this phase).
    compare_sets:
      probable_starters:
        title: "Probable Starters"
        metrics:
          - { key: era, label: "ERA", format: era, better: low }
    # Implied-total label wording (the number/units the UI shows). Sport-specific
    # phrasing lives here, not in the JS.
    est_total:
      label: "Run Estimate"
      unit: "runs"
      note: "Rough model estimate from team form & pitching — not a betting line. No park, weather, or lineup data."
    # First five innings is its own, cruder model (starters only, no bullpen),
    # so it gets its own wording: the note names the assumption that actually
    # limits it rather than repeating the full-game caveats.
    first_five_total:
      label: "First Five Estimate"
      unit: "runs"
      note: "Rough model estimate from the probable starters — not a betting line. Assumes both starters work the first five; no bullpen, park, weather, or lineup data."
  # Reserved for future sports; empty = no config-driven affordances render.
  worldcup: {}
