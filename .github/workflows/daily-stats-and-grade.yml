name: Regenerate stats and grade picks

# Daily grading of yesterday's Signal Score picks, followed by a deterministic-
# only regeneration of today's stats/signals. Deliberately its OWN workflow
# rather than a step bolted onto deploy-pages.yml or capture-training-data.yml:
#   * deploy-pages.yml keeps `permissions: contents: read` and already runs
#     generate_stats.py itself, but only to build output/data.json for the
#     site -- it never commits data/insights.games.json, data/insights.json,
#     or the signal-report ledger, and is not modified by this workflow at
#     all;
#   * capture-training-data.yml owns data/training/ exclusively; this
#     workflow never touches that directory or that file;
#   * `contents: write` here is scoped to this workflow alone, and is used
#     for nothing but committing the three files below.
#
# Grade BEFORE regenerate -- this order is load-bearing, not stylistic.
# data/insights.games.json holds exactly ONE slate at a time (generate_stats.py
# rebuilds it pruned to today's gamePks; yesterday's slate drops off -- see
# signal_report.py's own "the store is pruned to one slate per run; past
# slates live in git history"). signal_report.py defaults to grading
# yesterday, so it has to read the store while it still covers yesterday --
# i.e. before generate_stats.py overwrites it with today's slate. Verified
# live: running generate_stats.py first and grading second didn't just miss
# yesterday's data, it silently graded TODAY's newly-pruned gamePks under
# YESTERDAY's date (a few gamePk collisions were enough to pass the overlap
# check), writing spurious UNRESOLVED rows into the permanent ledger under
# the wrong date. Grade-then-regenerate is the only order that reads each
# store while it actually covers the date being asked about.
#
# SP_SKIP_INSIGHTS=1 is set unconditionally on the regenerate step (not a
# toggle): it skips generate_insights.py's `claude -p` AI-prose calls while
# leaving the deterministic game builder -- standout, betting_signals, pulse,
# and Signal Score -- running exactly as it does today. As of 2026-07-28,
# config.yaml's `ai_insights.enabled: false` already disables the AI-prose
# path by default repo-wide, so this env var is now belt-and-suspenders: it
# keeps this workflow AI-call-free and auth-free even if that config default
# is ever flipped back for local/dev use.
#
# generate_insights.py previously only persisted data/insights.games.json and
# data/insights.json from inside the AI-generation loops (_generate_all /
# _generate_games) -- the merge-only skip path built entities in memory for
# the current run's output/data.json but never wrote them back to the
# committed store. With ai_insights.enabled defaulting to false, that path is
# now permanent, so the stores would never have advanced past whatever date
# AI generation last actually ran. Fixed in generate_insights.py to persist
# the deterministic build unconditionally (carrying forward only previously-
# generated text, never inventing any); verified live that the stores now
# advance on every skip-mode run.
#
# The two halves below run INDEPENDENTLY, each committed on its own outcome:
# grading a transient signal_report.py failure must never block today's
# regenerate step from persisting the slate that TOMORROW's grading run will
# need, and vice versa. That's a real risk, not a hypothetical: gating the
# two together would turn one bad day into two. The job still ends red if
# either half failed (annotated below); it just doesn't lose the half that
# worked.
#
# Two cron entries, not one, and not three:
#   * This repo's scheduler has dropped entire days outright (all three of
#     capture-training-data.yml's entries failed to fire on 2026-07-27) --
#     that is scheduler downtime, not a timing problem, and a single entry
#     has no defense against it.
#   * Both entries stay BEFORE the earliest documented MLB first pitch
#     (~16:05-16:15 UTC, per capture-training-data.yml's measurements). That
#     line is a hard invariant here, not just a nice-to-have: unlike
#     training capture, a late run wouldn't fail -- but it would compute
#     some of the day's picks from a game already in progress instead of
#     pre-game, silently mixing pre-game and mid-game picks into the same
#     committed store that tomorrow's grading run reads as "the pick." A
#     third entry pushed close to (or past) first pitch would trade that
#     integrity for marginal extra outage coverage, which isn't worth it.
#   * Unlike capture-training-data.yml's redundancy (which walks the
#     probable-starter announcement curve -- each entry gets genuinely
#     better data), these two entries are pure scheduler-outage insurance:
#     the deterministic builder doesn't need starters announced to produce
#     a valid (if less complete) score, and grading reads whatever the store
#     already holds regardless of which entry fires it.
#   * Residual risk: an outage spanning the full 13:40-15:40 UTC window
#     (which is what actually happened on 2026-07-27) still leaves a
#     `no_store` gap for that date. Recovery is manual `workflow_dispatch`,
#     same as the rest of this project's rare-failure handling.
#
# Daylight saving: shift both entries by +1h in the fall to hold the wall-
# clock times, same caveat as the other scheduled workflows here.

on:
  schedule:
    - cron: "40 13 * * *"
    - cron: "40 15 * * *"
  workflow_dispatch: {}

# Scoped to this workflow only. deploy-pages.yml and capture-training-data.yml
# are unchanged.
permissions:
  contents: write

# Never let two runs (the two cron entries, or a manual dispatch overlapping
# a scheduled one) race on the same commits.
concurrency:
  group: daily-stats-and-grade
  cancel-in-progress: false

jobs:
  grade-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Reads yesterday's picks out of whatever the committed store currently
      # holds -- which, at this point in the job, is still whatever the LAST
      # run of this workflow left behind (i.e. yesterday's slate). Must run
      # before the regenerate step below; see the header comment.
      - name: Grade yesterday's Signal Score picks
        id: grade_picks
        run: python3 signal_report.py

      # Independent of the regenerate step: commits only if grading itself
      # succeeded, regardless of what happens below.
      - name: Commit grading
        id: commit_grading
        if: ${{ steps.grade_picks.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signal_report_history.jsonl
          if git diff --staged --quiet; then
            echo "No new grading rows this run -- nothing to commit."
            exit 0
          fi
          git commit -m "Grade yesterday's picks for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing and retrying"
            sleep $((attempt * 4))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push failed after 3 attempts"
          exit 1

      # Deterministic game builder only -- no AI calls, no auth needed. Runs
      # regardless of the grading step's outcome (`!cancelled()` overrides
      # the default success()-over-the-whole-job gating) -- a grading
      # failure must not also cost tomorrow's grading run its store.
      - name: Regenerate stats and signals
        id: generate_stats
        if: ${{ !cancelled() }}
        env:
          SP_SKIP_INSIGHTS: "1"
        run: python3 generate_stats.py

      # Independent of the grading step: commits only if regeneration itself
      # succeeded.
      - name: Commit stats and signals
        id: commit_stats
        if: ${{ !cancelled() && steps.generate_stats.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insights.games.json data/insights.json
          if git diff --staged --quiet; then
            echo "No changes this run -- nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate stats and signals for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing and retrying"
            sleep $((attempt * 4))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push failed after 3 attempts"
          exit 1

      # Backstop annotation so any failure in either half is always
      # diagnosable from the summary, not just the logs -- same standard as
      # capture-training-data.yml. Costs nothing on a normal run.
      - name: Annotate failure
        if: failure()
        run: |
          day="$(date -u +%Y-%m-%d)"
          if [ "${{ steps.grade_picks.outcome }}" = "failure" ]; then
            echo "::warning title=Signal report grading failed::signal_report.py failed for $day. Nothing was committed for grading this run -- see the Grade yesterday's Signal Score picks step logs."
          fi
          if [ "${{ steps.generate_stats.outcome }}" = "failure" ]; then
            echo "::warning title=Stats regeneration failed::generate_stats.py failed for $day. Nothing was committed for stats/signals this run -- see the Regenerate stats and signals step logs."
          fi
          if [ "${{ steps.commit_grading.outcome }}" = "failure" ]; then
            echo "::warning title=Grading commit/push failed::signal_report.py succeeded for $day but the commit or push failed -- see the Commit grading step logs."
          fi
          if [ "${{ steps.commit_stats.outcome }}" = "failure" ]; then
            echo "::warning title=Stats commit/push failed::generate_stats.py succeeded for $day but the commit or push failed -- see the Commit stats and signals step logs."
          fi
