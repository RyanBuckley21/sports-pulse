name: Regenerate stats and grade picks

# Daily grading of yesterday's Signal Score picks, followed by a deterministic-
# only regeneration of today's stats/signals. Deliberately its OWN workflow
# rather than a step bolted onto deploy-pages.yml or capture-training-data.yml:
#   * deploy-pages.yml keeps `permissions: contents: read` and already runs
#     generate_stats.py itself, but only to build output/data.json for the
#     site -- it never commits data/insights.games.json, data/insights.json,
#     or the signal-report ledger, and is not modified by this workflow at
#     all;
#   * capture-training-data.yml owns data/training/ exclusively; this
#     workflow never touches that directory or that file;
#   * `contents: write` here is scoped to this workflow alone, and is used
#     for nothing but committing the three files below.
#
# Grade BEFORE regenerate -- this order is load-bearing, not stylistic.
# data/insights.games.json holds exactly ONE slate at a time (generate_stats.py
# rebuilds it pruned to today's gamePks; yesterday's slate drops off -- see
# signal_report.py's own "the store is pruned to one slate per run; past
# slates live in git history"). signal_report.py defaults to grading
# yesterday, so it has to read the store while it still covers yesterday --
# i.e. before generate_stats.py overwrites it with today's slate. Verified
# live: running generate_stats.py first and grading second didn't just miss
# yesterday's data, it silently graded TODAY's newly-pruned gamePks under
# YESTERDAY's date (a few gamePk collisions were enough to pass the overlap
# check), writing spurious UNRESOLVED rows into the permanent ledger under
# the wrong date. Grade-then-regenerate is the only order that reads each
# store while it actually covers the date being asked about.
#
# SP_SKIP_INSIGHTS=1 is set unconditionally on the regenerate step (not a
# toggle): it skips generate_insights.py's `claude -p` AI-prose calls while
# leaving the deterministic game builder -- standout, betting_signals, pulse,
# and Signal Score -- running exactly as it does today. As of 2026-07-28,
# config.yaml's `ai_insights.enabled: false` already disables the AI-prose
# path by default repo-wide, so this env var is now belt-and-suspenders: it
# keeps this workflow AI-call-free and auth-free even if that config default
# is ever flipped back for local/dev use.
#
# generate_insights.py previously only persisted data/insights.games.json and
# data/insights.json from inside the AI-generation loops (_generate_all /
# _generate_games) -- the merge-only skip path built entities in memory for
# the current run's output/data.json but never wrote them back to the
# committed store. With ai_insights.enabled defaulting to false, that path is
# now permanent, so the stores would never have advanced past whatever date
# AI generation last actually ran. Fixed in generate_insights.py to persist
# the deterministic build unconditionally (carrying forward only previously-
# generated text, never inventing any); verified live that the stores now
# advance on every skip-mode run.
#
# The two halves below run INDEPENDENTLY: grading a transient signal_report.py
# failure must never block today's regenerate step from persisting the slate
# that TOMORROW's grading run will need, and vice versa. That's a real risk,
# not a hypothetical: gating the two together would turn one bad day into two.
# The job still ends red if either half failed (annotated below); it just
# doesn't lose the half that worked.
#
# The stats/signals commit is gated on that step's own exit code (nothing
# meaningful to commit on a failed build). The GRADING commit is gated on the
# ledger file actually changing, not on signal_report.py's exit code --
# its "no gamePk overlap" die() path writes a self-documenting no_store row
# BEFORE it exits non-zero, specifically so a genuine gap is recorded rather
# than silently dropped; success-gating that commit would throw the row away
# right when it matters. Every other die() path in signal_report.py writes
# nothing, so this stays a no-op on a real crash.
#
# FOUR cron entries, and the two added in front of the original pair are there
# for a reason the original pair could not have anticipated.
#
# THE INVARIANT, unchanged: every entry stays BEFORE the earliest documented
# MLB first pitch (~16:05-16:15 UTC, per capture-training-data.yml's
# measurements). That is not a nice-to-have. A late run does not FAIL -- it
# computes some of the day's picks from a game already in progress and writes
# them into the same committed store tomorrow's grading run reads as "the
# pick", silently mixing pre-game and mid-game selections. This comment used to
# argue against a third entry on exactly that basis, and it was right: the
# entries it was refusing were LATER ones. These two are EARLIER, so they serve
# the invariant instead of trading it away.
#
# WHY EARLIER ENTRIES BECAME NECESSARY. The old pair assumed the scheduler
# fires roughly on time, and for a long while it did (+26 to +56 minutes across
# 2026-08-24..26). Then it did not. Measured lateness against the schedule:
#
#     2026-08-27   +9h22m / +8h54m     -> landed 23:02Z and 00:34Z
#     2026-08-28   +9h31m              -> landed 23:11Z
#     2026-08-29   +3h42m / +3h08m
#     2026-08-30   +4h05m / +3h07m
#
# On the two worst days BOTH entries landed five to eight hours PAST first
# pitch, so the invariant held on paper and was broken in fact. A 10:00 entry
# absorbs six hours of delay before it crosses the line; the old 15:40 one
# absorbs twenty-five minutes.
#
# WHY NOT EARLIER STILL. 10:00 UTC is 06:00 US Eastern, which is the earliest
# hour that is safe to GRADE from. Grading runs first in this job, and a run
# that grades before the previous day's games are final records PENDING picks
# -- which then STICK: signal_report's "already graded, nothing to do" branch
# sees a run that recorded picks and exits clean, so no later entry ever
# revisits them. By 06:00 ET every sport here is done (an extra-inning MLB game
# ends by ~01:30 ET, an NFL Monday nighter by ~23:30 ET), and an 02:00 ET entry
# would not be.
#
# WHAT THE REDUNDANCY IS FOR, unchanged: pure scheduler insurance, not better
# data. Unlike capture-training-data.yml's entries -- which walk the
# probable-starter announcement curve and each get genuinely better inputs --
# the deterministic builder needs no starters to produce a valid score, and
# grading reads whatever the store holds regardless of which entry fires it.
# The store-protection rule (generate_insights._games_store_writable) means a
# later entry cannot overwrite an earlier entry's clean pre-game snapshot, so
# extra entries can only help.
#
# RESIDUAL RISK: correlated delay. The four entries are separate draws but not
# independent ones -- on 2026-08-27 both were ~9h late together, and four
# entries all delayed nine hours all land past first pitch. This widens the
# window that has to fail, it does not close it. Recovery stays manual
# `workflow_dispatch`, same as the rest of this project's rare-failure
# handling.
#
# Daylight saving: shift every entry by +1h in the fall to hold the wall-clock
# times, same caveat as the other scheduled workflows here.

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"
    - cron: "40 13 * * *"
    - cron: "40 15 * * *"
  workflow_dispatch: {}

# Scoped to this workflow only. deploy-pages.yml and capture-training-data.yml
# are unchanged.
permissions:
  contents: write

# Never let two runs (the two cron entries, or a manual dispatch overlapping
# a scheduled one) race on the same commits.
concurrency:
  group: daily-stats-and-grade
  cancel-in-progress: false

jobs:
  grade-and-regenerate:
    runs-on: ubuntu-latest
    # A normal run (grade + regenerate + both commits) finishes in well under
    # two minutes -- every observed successful run has landed between 42s and
    # 71s end to end. Left at the GitHub default (360 min), a hang has nothing
    # to stop it but a human noticing and hitting Cancel: on 2026-08-06 both
    # cron entries stalled on something (no commit of any kind came out of
    # either) and sat for ~15 minutes each before a manual cancel ended them --
    # long enough that the date they were grading was left with no ledger row
    # at all, not even the self-documenting no_store one a clean die() would
    # have written. 10 minutes is generous headroom over the ~1-minute norm
    # while still failing on its own, loudly, well inside that same run's
    # window -- instead of quietly occupying the concurrency slot until
    # someone happens to look.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Reads yesterday's picks out of whatever the committed store currently
      # holds -- which, at this point in the job, is still whatever the LAST
      # run of this workflow left behind (i.e. yesterday's slate). Must run
      # before the regenerate step below; see the header comment.
      - name: Grade yesterday's Signal Score picks
        id: grade_picks
        run: python3 signal_report.py

      # EPL, graded as its own invocation rather than as a loop inside
      # signal_report.py. Two reasons, both about blast radius.
      #
      # One sport's grading must not take another's down. signal_report exits
      # non-zero on a genuine gap and writes its ledger row before doing so, and
      # a single process grading both sports would abandon the second the moment
      # the first hit that path. Separate steps means an EPL provider outage
      # cannot cost MLB its grading, which is the same isolation reasoning the
      # generate_stats and _build_game_entities fetch loops now follow.
      #
      # continue-on-error, unlike the MLB step, because EPL HAS NO GRADED
      # HISTORY YET and its early weeks are expected to be empty: form does not
      # cross a season boundary, so every club sits below the five-match gate
      # until roughly late September and the honest output is a `no_picks` row
      # every day until then. That is exit 0 and commits normally -- but any
      # real EPL-side failure in that window would red this workflow daily for a
      # month and train everyone to ignore it, which is exactly the alarm
      # fatigue this file's own header argues against. MLB's step stays strict.
      # Revisit once EPL has a real graded record to protect.
      - name: Grade yesterday's EPL picks
        id: grade_picks_epl
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 signal_report.py --sport epl

      # CFB, same isolation and the same leniency, for reasons that are its own
      # rather than borrowed from EPL's.
      #
      # continue-on-error because a CFB season is FOUR MONTHS LONG and this
      # workflow runs every day of the year. From February to August there is
      # no slate at all, so the honest output is a `no_picks` row daily for
      # eight months -- redding the workflow through the entire offseason would
      # train everyone to ignore it, which is the alarm fatigue this file's
      # header argues against. MLB's step stays strict.
      #
      # In-season the gap is narrower but real: college football plays Tuesday
      # through Saturday in some weeks and not at all in others (open dates,
      # championship week, the bowl gap between mid-December and New Year), so
      # an empty Monday is routine rather than a signal.
      - name: Grade yesterday's CFB picks
        id: grade_picks_cfb
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 signal_report.py --sport cfb

      # NFL, same isolation and the same leniency. The reason is its own: the
      # NFL plays Thursday, Sunday and Monday, so THREE OR FOUR DAYS A WEEK
      # have no games at all even at the height of the season, and from
      # February to early September none do. signal_report exits clean on an
      # empty slate rather than recording a gap, so those days are quiet -- but
      # a genuine early-season gap (nflverse has not cut that week's release
      # yet) would still exit non-zero, and redding this workflow for a
      # third-party publishing lag is the alarm fatigue this file's header
      # argues against. MLB's step stays strict.
      - name: Grade yesterday's NFL picks
        id: grade_picks_nfl
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 signal_report.py --sport nfl

      # Gated on the FILE having changed, not on grade_picks having exited 0.
      # signal_report.py's own "no gamePk overlap" die() path writes a
      # self-documenting no_store row to the ledger BEFORE it exits non-zero
      # -- that's how it records a genuine gap instead of leaving it as a
      # silent absence. Gating this step on grade_picks' exit code would
      # discard that row exactly when it matters most. Every OTHER die() path
      # (bad --date, empty store, schedule fetch failure) writes nothing, so
      # `git diff --staged --quiet` below still correctly no-ops on a real
      # crash -- this is strictly more correct than success-gating, not just
      # more lenient. `!cancelled()` (rather than no `if` at all) still skips
      # this on a cancelled job.
      - name: Commit grading
        id: commit_grading
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signal_report_history.jsonl
          if git diff --staged --quiet; then
            echo "No new grading rows this run -- nothing to commit."
            exit 0
          fi
          git commit -m "Grade yesterday's picks for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing and retrying"
            sleep $((attempt * 4))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push failed after 3 attempts"
          exit 1

      # Deterministic game builder only -- no AI calls. Runs regardless of the
      # grading step's outcome (`!cancelled()` overrides the default
      # success()-over-the-whole-job gating) -- a grading failure must not
      # also cost tomorrow's grading run its store.
      #
      # CFBD_API_KEY is scoped to THIS STEP rather than the job or workflow,
      # matching the only other env block here (SP_SKIP_INSIGHTS, directly
      # below it). This is the sole step in this workflow that can reach the
      # CFB fetcher: generate_stats.py -> generate_insights.run() ->
      # GAME_BUILDERS. The grading step above cannot -- signal_report.py
      # imports no fetchers at all, and its schedule lookup is MLB StatsAPI-
      # shaped -- so widening the secret to the job would expose it to a step
      # that has no use for it.
      #
      # CFB_ALLOW_CFBD IS SET HERE AND NOWHERE ELSE, and that is the whole
      # quota-safety mechanism -- see fetchers/cfb.py's CFBD_ALLOW_ENV.
      #
      # The free CFBD tier is 1,000 calls a month. This fetcher's cost is meant
      # to be zero in steady state: each week is fetched once and cached per
      # (season, week) in data/boxscores.json. That only holds if the cache is
      # committed, and THIS WORKFLOW IS THE ONLY ONE THAT COMMITS IT (see the
      # `git add data/boxscores.json` step below). deploy-pages.yml runs the
      # same fetcher on every push to main and commits nothing, so any call it
      # made would be discarded and re-made next run -- roughly 1,440 calls a
      # month once the season is deep enough, over the tier, with nothing
      # announcing it.
      #
      # So the flag says "this run can keep what it buys". Unset, the fetcher
      # serves the committed cache and skips the network entirely. The failure
      # mode if this workflow stops is therefore STALE CFB FORM, not an
      # exhausted quota -- which is the right way round.
      - name: Regenerate stats and signals
        id: generate_stats
        if: ${{ !cancelled() }}
        env:
          SP_SKIP_INSIGHTS: "1"
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_ALLOW_CFBD: "1"
        run: python3 generate_stats.py

      # Independent of the grading step: commits only if regeneration itself
      # succeeded.
      - name: Commit stats and signals
        id: commit_stats
        if: ${{ !cancelled() && steps.generate_stats.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/boxscores.json rides along with the two insight stores: the same
          # generate_stats run produces all three, so splitting them into separate
          # commits would only add noise. It was previously left out, which meant
          # the correctly-updated local copy died with the runner and every run
          # restarted from the same stale committed snapshot -- re-fetching every
          # boxscore in each team's trailing 7-day bullpen window from scratch.
          # It is self-limiting, not an accumulating log: build_game_entities
          # returns it pruned to exactly the gamePks the current run touched.
          git add data/insights.games.json data/insights.json data/boxscores.json
          if git diff --staged --quiet; then
            echo "No changes this run -- nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate stats and signals for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing and retrying"
            sleep $((attempt * 4))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push failed after 3 attempts"
          exit 1

      # Backstop annotation so any failure in either half is always
      # diagnosable from the summary, not just the logs -- same standard as
      # capture-training-data.yml. Costs nothing on a normal run.
      - name: Annotate failure
        if: failure()
        run: |
          day="$(date -u +%Y-%m-%d)"
          if [ "${{ steps.grade_picks.outcome }}" = "failure" ]; then
            echo "::warning title=Signal report grading failed::signal_report.py failed for $day -- either a genuine no_store/no_picks gap (self-documented in the ledger and still committed) or a real error. See the Grade yesterday's Signal Score picks step logs to tell which."
          fi
          if [ "${{ steps.generate_stats.outcome }}" = "failure" ]; then
            echo "::warning title=Stats regeneration failed::generate_stats.py failed for $day. Nothing was committed for stats/signals this run -- see the Regenerate stats and signals step logs."
          fi
          if [ "${{ steps.commit_grading.outcome }}" = "failure" ]; then
            echo "::warning title=Grading commit/push failed::signal_report.py succeeded for $day but the commit or push failed -- see the Commit grading step logs."
          fi
          if [ "${{ steps.commit_stats.outcome }}" = "failure" ]; then
            echo "::warning title=Stats commit/push failed::generate_stats.py succeeded for $day but the commit or push failed -- see the Commit stats and signals step logs."
          fi
