name: Fetch team logos

# Manual only -- this caches team logos into assets/logos/ so the daily
# deploy workflow never needs network access to mlbstatic.com or
# a.espncdn.com. Re-run only when logos are missing or a new team needs
# adding (e.g. a World Cup team not seen in the cached date range).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r scripts/requirements.txt
      - run: playwright install --with-deps chromium
      # CFBD_API_KEY is needed by fetch_cfb_logos alone -- the MLB, NFL, EPL
      # and World Cup fetchers are all keyless. Step-scoped, matching the
      # pattern in daily-stats-and-grade.yml and deploy-pages.yml.
      #
      # Its absence here is why run #3 (2026-08-16) went green having fetched
      # ZERO CFB crests: fetch_cfb_logos skips when the key is unset so that a
      # local run can still cache the other four sports, and that skip was
      # invisible in a successful run. The skip now emits a ::warning::
      # annotation as well, so a future keyless run says so in the summary
      # rather than only in the logs.
      - run: python3 scripts/fetch_logos.py
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/logos
          git diff --cached --quiet && echo "No logo changes to commit" || git commit -m "Update cached team logos"
          git push
