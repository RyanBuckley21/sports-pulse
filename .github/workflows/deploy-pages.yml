name: Deploy who's-hot dashboard to GitHub Pages

on:
  schedule:
    # 14:00 UTC = 10:00 AM US Eastern (EDT, UTC-4). Shift to 15:00 UTC when
    # the US switches back to EST (UTC-5) in the fall if you want the wall-
    # clock time to stay fixed at 10:00 AM Eastern.
    - cron: "0 14 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Training-capture drop alarm. Deliberately hosted HERE, in the deploy
      # workflow, and not in capture-training-data.yml.
      #
      # capture-training-data.yml's own coverage check (added in #15) can only
      # report on a run that happened. The failure it cannot see is the one that
      # actually cost the most: on 2026-07-27 not one of that workflow's cron
      # entries fired at all, the entire 12-game slate was lost, and nothing
      # anywhere said so -- it was found by hand-diffing commit history. An
      # alarm attached to that same workflow's schedule shares the failure it is
      # meant to detect, so a systemic drop would silence the alarm and the
      # capture together.
      #
      # This workflow's schedule is demonstrably independent of it. On
      # 2026-07-27 -- the very day all three capture entries were dropped --
      # deploy-pages' 14:00 cron DID fire (19:00:27Z, +5.0h late, success). It
      # also runs on every push to main, so it has trigger paths the capture
      # workflow does not have at all: 23 push runs vs 7 scheduled in the last
      # 30. Its cron is late just as often (+3.6h..+5.0h), which does not matter
      # here -- this check reads yesterday, so any time of day works.
      #
      # Runs before pip install because it needs only the standard library, and
      # early so a later build failure cannot suppress it. Adds no permissions:
      # it reads a committed file and makes one unauthenticated GET, so
      # `contents: read` stays exactly as it is. Never fails the job.
      #
      # Scope: ZERO rows only. Partial-slate days are already reported by
      # capture-training-data.yml's own coverage check, and warning twice for
      # one condition would just train people to ignore both.
      - name: Alarm if yesterday captured nothing
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request
          y = (datetime.datetime.now(datetime.timezone.utc).date()
               - datetime.timedelta(days=1)).isoformat()
          path = "data/training/mlb_features.jsonl"
          rows = 0
          if os.path.exists(path):
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      if json.loads(line).get("date") == y:
                          rows += 1
                  except ValueError:
                      continue
          if rows:
              print("training capture for %s: %d feature row(s) on file -- OK" % (y, rows))
              raise SystemExit(0)
          # Zero rows is only an alarm if there were games to capture. An empty
          # slate (All-Star break, season boundary) is a correct zero.
          try:
              sched = json.load(urllib.request.urlopen(
                  "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=" + y, timeout=30))
              games = sum(len(d.get("games") or []) for d in sched.get("dates", []))
          except Exception as e:
              print("::warning title=Capture drop alarm inconclusive for %s::no feature rows on "
                    "file and the schedule could not be fetched (%s), so 'no games' and 'capture "
                    "lost the slate' cannot be told apart." % (y, str(e)[:120]))
              raise SystemExit(0)
          if not games:
              print("training capture for %s: 0 rows, but 0 games were scheduled -- OK" % y)
              raise SystemExit(0)
          print("::warning title=Training capture MISSED %s entirely::%d games were scheduled and "
                "NOT ONE has a feature row. Every entry of capture-training-data.yml either failed "
                "to fire or was refused by the pre-game gates. Those games are permanently absent "
                "from the append-only store; a workflow_dispatch now cannot recover them, only a "
                "future day's capture can be protected." % (y, games))
          PY

      - run: pip install -r requirements.txt
      - run: python3 generate_stats.py
      - run: |
          mkdir -p site
          # The navigation shell is one document: index.html plus the three
          # stylesheet/script pairs it loads. The five standalone insights pages
          # it replaced are gone, so there are no other HTML files to publish.
          cp web/index.html web/app.css web/app.js web/shell.css web/shell.js site/
          cp output/data.json site/data.json
          cp -r assets site/assets
          # insights.css and insights.js are loaded by the shell from here, and
          # the teams + components views fetch mock-insights.json from here too.
          cp -r web/insights site/insights
          # Cache-bust every local stylesheet and script on each deploy: without
          # this, Safari (especially in "Add to Home Screen" standalone mode) can
          # keep serving a stale cached copy indefinitely even after a hard
          # refresh or app relaunch, since nothing about the URL ever changes
          # from one deploy to the next.
          for ref in app.css shell.css insights.css app.js shell.js insights.js; do
            sed -i "s|${ref}\"|${ref}?v=${GITHUB_SHA}\"|" site/index.html
          done
          # Fail the build rather than publish an app that cannot be busted. The
          # sed above matches on filename, so renaming a file would silently stop
          # it matching and ship a permanently stale app to exactly the
          # standalone users this whole block exists to protect. Any local .css
          # or .js reference still lacking the query string is that bug.
          if grep -nE '(href|src)="[^"]*\.(css|js)"' site/index.html; then
            echo "::error::cache-bust missed the reference(s) listed above"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
