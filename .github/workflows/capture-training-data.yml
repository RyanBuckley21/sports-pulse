name: Capture MLB training data

# Phase 1 of the predictive-model initiative (docs/mlb-training-data-phase-1-plan.md):
# deterministic daily capture of pre-game features and post-game outcomes into
# the append-only training store. No model, no training, no inference.
#
# Deliberately its OWN workflow rather than a step bolted onto deploy-pages.yml:
#   * deploy-pages.yml keeps `permissions: contents: read` and gains no write
#     path -- it is not modified by this initiative at all;
#   * `contents: write` here is scoped to this workflow alone, and is used for
#     nothing but committing the two data/training/ files;
#   * if this workflow fails, the site deploy is entirely unaffected.
#
# Runs 20 minutes after the deploy workflow's 14:00 UTC cron so the two never
# contend, while still landing ~1h45m before the earliest typical first pitch
# (~16:05-16:15 UTC). Games that start before this run are correctly SKIPPED by
# training_capture's clock gate rather than captured after the fact.

on:
  schedule:
    # THREE entries, deliberately redundant. GitHub does not run scheduled
    # workflows on time under load: the 2026-07-26 run was due 14:20 UTC and
    # actually started 17:46 UTC, a 3h26m delay. First pitch that day was 16:15
    # UTC, so 9 of 15 games had already started and were (correctly) refused by
    # the pre-game gates -- a single 14:20 entry would have captured 6 of 15.
    #
    # A single cron cannot be made safe by moving it, because the delay is
    # unbounded. Redundancy can: capture_features() is skip-if-present on
    # (gamePk, date), so whichever entry lands first captures the slate and the
    # later ones are free no-ops. Three tries have to ALL be delayed past first
    # pitch before a day is lost.
    #
    # 09:20 UTC is the earliest entry because probable starters are essentially
    # all announced by then -- measured 2026-07-27: >=80% of games had both
    # starters announced 18h BEFORE a 09:20 run would fire, ~92% on the day.
    # Moving to 10:20 would buy ~nothing in completeness (that band of the
    # announcement curve is flat) and cost an hour of delay margin. A row with a
    # null starter_era is an honest gap and strictly better than no row.
    #
    # Daylight saving: same caveat as deploy-pages.yml -- shift all three by
    # +1h in the fall to hold the wall-clock times. Capture timing only affects
    # how much margin there is before first pitch; it can never cause a
    # post-start capture, which the clock gate blocks regardless.
    - cron: "20 9 * * *"
    - cron: "20 11 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch: {}

# Scoped to this workflow only. deploy-pages.yml is unchanged and still read-only.
permissions:
  contents: write

# Never let two capture runs race on the same append-only files.
concurrency:
  group: capture-training-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Capture features and resolve outcomes
        id: capture
        run: python3 capture_training_data.py

      # capture_training_data.py annotates the specific step that failed, but a
      # hard crash (or a non-zero exit before it can print) would leave nothing
      # on the summary. This backstop always annotates, so a red run is always
      # diagnosable without opening the logs. `if: failure()` means it costs
      # nothing on a normal run.
      - name: Annotate capture failure
        if: failure() && steps.capture.outcome == 'failure'
        run: |
          echo "::warning title=Training capture failed::No training data was committed for $(date -u +%Y-%m-%d). The store has a gap for this date unless a later run backfills it -- see the Capture step logs."

      # Runs even when the capture step failed. Anything already written to the
      # store is a genuine, gate-passed capture, and throwing it away because
      # the OTHER step failed would open exactly the gap this workflow exists to
      # prevent. The job still ends red -- the failure stays visible, the real
      # rows still land. Skipped only on cancellation.
      - name: Commit the training store
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p data/training
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/training
          if git diff --staged --quiet; then
            echo "No new training rows this run -- nothing to commit."
            exit 0
          fi
          git commit -m "Capture MLB training data for $(date -u +%Y-%m-%d)"
          # Rebase-and-retry: the store is append-only, so a concurrent commit
          # on the branch is additive and rebases cleanly.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing and retrying"
            sleep $((attempt * 4))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push failed after 3 attempts"
          exit 1
